u_tito:{
  capitolo:"Area Segreta · Uffici", sfondo:"uffici.jpg", chi:"tito", tornaHub:"uffici_hub",
  tornaTesto:"← Torna nel corridoio",
  imposta:{ tito_ufficio:"fatta" },
  titolo:"«Ma io a te ti conosco!»",
  testo:"Tito sta bevendo un caffè. Alza lo sguardo e ti inquadra. Sgrana gli occhi. «Ma io ti conosco! Sei quello del bambino perso nel parco! Sapevo che eri un soggetto strano. Ma che ci fai negli uffici? Mamma mia, levati di torno prima che chiami di nuovo i Carabinieri!». Ti caccia via ridacchiando sotto i baffi, prendendoti palesemente per il culo."
},

u_tito_estraneo:{
  capitolo:"Area Segreta · Uffici", sfondo:"uffici.jpg", chi:"tito", tornaHub:"uffici_hub",
  tornaTesto:"← Torna nel corridoio",
  imposta:{ tito_ufficio:"fatta" },
  titolo:"«Finalmente! La aspettavamo da stamattina»",
  testo:"Tito ti vede, posa il caffè e ti viene incontro con la mano già tesa. «Finalmente! La aspettavamo da stamattina, si accomodi». Non hai idea di chi ti abbia scambiato per chi, ma è la prima volta oggi che qualcuno è contento di vederti, e non hai nessuna intenzione di rovinare il momento. Ti fa sedere, ti mette davanti una cartellina e comincia a parlare di margini, di resi e di un espositore da banco che secondo lui gira benissimo a Riccione. Tu annuisci con l'aria di chi conosce il settore. Poi arrivano i moduli. Firmi il primo perché è naturale, il secondo perché ormai hai firmato il primo, il terzo perché Tito ha già girato la pagina. A un certo punto ti chiede se ti va bene la fornitura trimestrale e tu rispondi che sì, assolutamente, meglio trimestrale. Ti stringe la mano, ti ringrazia per la disponibilità e torna al suo caffè. Esci con una copia carbone azzurrina in mano e la certezza che qualcuno, da qualche parte, riceverà novecento portachiavi."
},

u_antonella:{
  capitolo:"Area Segreta · Uffici", sfondo:"uffici.jpg", chi:"antonella", tornaHub:"uffici_hub",
  tornaTesto:"← Torna nel corridoio",
  imposta:{ antonella:"fatta" },
  titolo:"Il casting",
  testo:"Antonella sta aggiustando un treppiede con un ring light. Ti osserva attentamente, squadrandoti da capo a piedi. «Sei qui per il casting? Stiamo cercando un volto giovane e dinamico per TikTok dell'Acquario. Dai, fai un bel sorriso fresco e indica il vuoto con entusiasmo!». Ci provi con tutto te stesso. Lei fa una smorfia quasi schifata. «Mmh, no, assolutamente no. La tua faccia abbatterebbe l'algoritmo. Troppo... vecchia dentro. Accomodati fuori, grazie»."
},

u_alessandra:{
  capitolo:"Area Segreta · Uffici", sfondo:"uffici.jpg", chi:"alessandra", tornaHub:"uffici_hub",
  tornaTesto:"← Torna nel corridoio",
  imposta:{ alessandra:"fatta" },
  titolo:"«Rimborsi spesa»",
  testo:"Alessandra è sommersa da faldoni e sta distruggendo i tasti di una calcolatrice. «Se non quadra l'IVA del trimestre giuro che mi licenzio...» borbotta, con gli occhi iniettati di sangue. Fai un passo avanti e le appoggi sulla scrivania lo scontrino stropicciato della bottiglietta d'acqua comprata al padiglione. «Scusi, per il rimborso spese a chi lo devo lasciare?». Lei si blocca. Fissa lo scontrino umidiccio da 1,50 euro. Poi fissa te. Prende un timbro rosso, lo stampa con violenza inaudita sul tuo scontrino (e quasi sul tuo dito) e ti indica la porta tremando di rabbia."
},

u_cristina:{
  capitolo:"Area Segreta · Uffici", sfondo:"uffici.jpg", chi:"cristina", tornaHub:"uffici_hub",
  tornaTesto:"← Torna nel corridoio",
  imposta:{ cristina:"fatta" },
  titolo:"«Sei tu quello dell'Hotel Ancora?»",
  testo:"Cristina sbatte giù il telefono sulla scrivania e appena ti vede si illumina. «Ah, meno male! Sei il contatto dell'Hotel Ancora? Avete confermato le 40 persone in più per la visita guidata serale?». Tu, in preda al panico e senza alcun motivo logico, annuisci e dici: «Sì, certo, tutto confermato». Lei sbianca. «Quaranta in più?! Ma eravamo d'accordo per 15! Non c'è spazio!». Poi si ferma. Ti guarda bene. «Aspetta un attimo. Tu non hai la divisa dell'hotel. Chi diavolo sei?! Fuori di qui!»."
},

u_chiara:{
  capitolo:"Area Segreta · Uffici", sfondo:"uffici.jpg", chi:"chiara_ufficio", tornaHub:"uffici_hub",
  tornaTesto:"← Torna nel corridoio",
  imposta:{ chiara_ufficio:"fatta" },
  titolo:"Il test",
  testo:"Chiara ti intercetta bloccandoti con una cartelletta. «Sei il candidato per il posto di guida didattica per la prossima stagione? Molto bene, non c'è tempo da perdere. Facciamo un test rapido. Qual è il nome scientifico esatto del Pinguino di Humboldt?». Resti congelato. Sforzi le meningi e rispondi, serissimo: «Pinguinus grossus». Lei abbassa la penna. Fa un lungo sospiro. Ti indica il corridoio. «Se ne vada. Adesso»."
},

  testo:"Hai parlato con tutti. Proprio mentre stai per gettare la spugna, la porta della Direzione si apre. Daniela ha appena riattaccato la cornetta e ha un'aria distrutta. Ti inquadra dalla testa ai piedi. «Sei riuscito a infastidire letteralmente tutto il mio staff in meno di dieci minuti. Hai fegato, te lo concedo. Senti, siamo a corto di personale per i turni più massacranti in vasca e a me serve qualcuno che non si faccia troppi problemi. Ti propongo un contratto a tempo determinato. Ora. Che ne dici?»",

/* Etichetta di versione: visibile in fondo alle Impostazioni e in console.
   Serve a capire a colpo d'occhio se il telefono mostra la copia aggiornata
   o una vecchia rimasta in cache. Cambiala insieme al numero in sw.js. */
const VERSIONE_GIOCO = 'v17 · 31 agosto 2026';
console.log('🎮 Una giornata all\'Acquario — ' + VERSIONE_GIOCO);

const CHIAVE_OPZ = 'acquario_opzioni';
const DEFAULT_OPZ = { audio:true, ambient:.20, testo:6, animazioni:true, vibra:true, schermo:false };
const IMPOSTAZIONI = Object.assign({}, DEFAULT_OPZ);
try{
  const salvate = JSON.parse(localStorage.getItem(CHIAVE_OPZ) || '{}');
  Object.keys(IMPOSTAZIONI).forEach(k=>{
    if(salvate[k] === undefined) return;
    /* accetta il valore salvato solo se è fra quelli previsti: un dato
       sballato rimasto in memoria non deve poter bloccare il gioco */
    const opt = OPZIONI.find(o => o.k === k);
    const validi = opt ? opt.valori.map(v => v[1]) : null;
    if(!validi || validi.includes(salvate[k]) || (k === 'ambient' && typeof salvate[k] === 'number'))
      IMPOSTAZIONI[k] = salvate[k];
  });
  /* migrazione: prima "ambient" era on/off, ora è un livello di volume */
  if(typeof IMPOSTAZIONI.ambient === 'boolean') IMPOSTAZIONI.ambient = IMPOSTAZIONI.ambient ? .20 : 0;
}catch(e){ console.warn('ℹ️ Impostazioni non leggibili, uso i valori di default.'); }

function salvaImpostazioni(){
  try{ localStorage.setItem(CHIAVE_OPZ, JSON.stringify(IMPOSTAZIONI)); }catch(e){}
}

function applicaImpostazioni(){
  document.body.classList.toggle('no-anim', !IMPOSTAZIONI.animazioni);
  AUDIO.aggiorna();
}

/* Schermo intero. Il browser lo concede solo dentro un click o un tasto
   premuto dall'utente, quindi si chiama sempre da un gestore di eventi. */
function applicaSchermo(){
  const el = document.documentElement;
  try{
    let esito;
    if(IMPOSTAZIONI.schermo && !document.fullscreenElement){
      esito = (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el);
    } else if(!IMPOSTAZIONI.schermo && document.fullscreenElement){
      esito = (document.exitFullscreen || document.webkitExitFullscreen || (()=>{})).call(document);
    }
    /* su iPhone la richiesta viene rifiutata: va intercettata, altrimenti
       resta in giro una promessa rifiutata */
    if(esito && typeof esito.catch === 'function')
      esito.catch(() => console.warn('ℹ️ Schermo intero non disponibile su questo dispositivo.'));
  }catch(e){ console.warn('ℹ️ Schermo intero non disponibile qui.'); }
}

/* Se esci col tasto Esc del browser, la casella si aggiorna da sola */
document.addEventListener('fullscreenchange', () => {
  IMPOSTAZIONI.schermo = !!document.fullscreenElement;
  salvaImpostazioni();
  const ctrl = document.querySelector('.opt-ctrl[data-k="schermo"]');
  if(!ctrl) return;
  const opt = OPZIONI.find(o => o.k === 'schermo');
  ctrl.querySelectorAll('button').forEach((b,i) => {
    b.classList.toggle('on', opt.valori[i][1] === IMPOSTAZIONI.schermo);
  });
});

/* ══════════════════════════════════════════════════════════════
   AUDIO · tutto sintetizzato con WebAudio, zero file esterni
   ══════════════════════════════════════════════════════════════ */
const AUDIO = {
  ctx:null, master:null, fxGain:null, droneGain:null, rumore:null, partito:false,

  /* Va chiamato dentro un gesto dell'utente, o il browser blocca l'audio */
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ console.warn('ℹ️ WebAudio non disponibile: il gioco resta muto.'); return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);

    this.fxGain = this.ctx.createGain();
    this.fxGain.gain.value = IMPOSTAZIONI.audio ? 1 : 0;
    this.fxGain.connect(this.master);

    this.rumore = this.bufferRumore(2);
    this.avviaMusica();
    this.partito = true;
    if(this.ctx.state==='suspended') this.ctx.resume();

    /* Safari e i browser mobile sospendono il contesto quando cambi scheda */
    const risveglia = () => {
      if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
    };
    document.addEventListener('pointerdown', risveglia);
    document.addEventListener('visibilitychange', () => {
      if(!document.hidden) risveglia();
    });
  },

  bufferRumore(sec){
    const c=this.ctx, len=Math.floor(c.sampleRate*sec);
    const b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    return b;
  },

  /* Riverbero: impulso sintetico (rumore che decade) per dare profondità */
  impulso(sec, decadimento){
    const c=this.ctx, len=Math.floor(c.sampleRate*sec);
    const b=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0; ch<2; ch++){
      const d=b.getChannelData(ch);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len, decadimento||2.8);
    }
    return b;
  },

  mtof: m => 440*Math.pow(2,(m-69)/12),

  /* ── MUSICA ────────────────────────────────────────────────
     Ambient generativa in re minore: un tappeto di accordi che
     cambia ogni 11 secondi e sopra delle campanelle che cadono
     a intervalli irregolari, tutte dentro la scala dell'accordo
     in corso. Non si ripete mai uguale e non ha un attacco che
     tira l'attenzione: sta sotto e basta.                      */
  ACCORDI: [
    { pad:[50,57,62,65], scala:[69,72,74,77,81,84] },   // Re minore
    { pad:[46,53,57,65], scala:[70,72,77,79,84,86] },   // Si bemolle maggiore
    { pad:[41,53,57,60], scala:[69,72,74,77,81,84] },   // Fa maggiore
    { pad:[45,52,55,60], scala:[67,72,74,76,79,84] }    // La minore
  ],
  iAccordo:0, timerAccordo:null, timerCampana:null,

  avviaMusica(){
    const c=this.ctx;
    this.musicaGain = c.createGain();
    this.musicaGain.gain.value = 0;
    this.musicaGain.connect(this.master);

    this.riverbero = c.createConvolver();
    this.riverbero.buffer = this.impulso(3.6);
    const rg = c.createGain(); rg.gain.value = .90;
    this.riverbero.connect(rg); rg.connect(this.musicaGain);

    this.musicaDry = c.createGain(); this.musicaDry.gain.value = .75;
    this.musicaDry.connect(this.musicaGain);

    this.cicloAccordo();
    this.timerAccordo = setInterval(()=>this.cicloAccordo(), 11000);
    this.programmaCampana();

    this.musicaGain.gain.setValueAtTime(0, c.currentTime);
    this.musicaGain.gain.linearRampToValueAtTime(IMPOSTAZIONI.ambient, c.currentTime+5);
  },

  /* Una voce qualsiasi: oscillatore + filtro + inviluppo, in dry e in riverbero */
  voce(midi, quando, durata, o){
    const c=this.ctx;
    const osc=c.createOscillator();
    osc.type = o.tipo || 'sine';
    osc.frequency.value = this.mtof(midi);
    if(o.detune) osc.detune.value = o.detune;
    const filt=c.createBiquadFilter();
    filt.type='lowpass'; filt.frequency.value = o.cutoff || 1800; filt.Q.value=.6;
    const g=c.createGain();
    const att = o.attacco || .02;
    g.gain.setValueAtTime(.0001, quando);
    g.gain.exponentialRampToValueAtTime(o.vol, quando + att);
    if(o.rilascio){                       // tiene la nota, poi sfuma: niente buchi fra accordi
      g.gain.setValueAtTime(o.vol, quando + Math.max(att, durata - o.rilascio));
    }
    g.gain.exponentialRampToValueAtTime(.0001, quando + durata);
    osc.connect(filt); filt.connect(g);
    g.connect(this.musicaDry); g.connect(this.riverbero);
    osc.start(quando); osc.stop(quando + durata + .05);
  },

  /* Il tappeto: quattro note tenute, leggermente stonate fra loro */
  cicloAccordo(){
    if(!this.ctx || !IMPOSTAZIONI.ambient) { this.iAccordo=(this.iAccordo+1)%this.ACCORDI.length; return; }
    const t=this.ctx.currentTime + .05;
    const a=this.ACCORDI[this.iAccordo];
    a.pad.forEach((m,i)=>{
      this.voce(m, t, 14.5, { tipo:'triangle', vol:[.34,.25,.20,.16][i],
                              attacco:1.8, rilascio:3.0, cutoff:900, detune:(i-1.5)*4 });
    });
    this.voce(a.pad[0]-12, t, 14.5, { tipo:'sine', vol:.30, attacco:1.6, rilascio:3.0, cutoff:300 });
    this.iAccordo = (this.iAccordo+1) % this.ACCORDI.length;
  },

  /* Le campanelle: nota della scala + ottava sopra appena accennata */
  campana(){
    if(!this.ctx || !IMPOSTAZIONI.ambient) return;
    const t=this.ctx.currentTime + .05;
    const a=this.ACCORDI[(this.iAccordo + this.ACCORDI.length - 1) % this.ACCORDI.length];
    const m=a.scala[Math.floor(Math.random()*a.scala.length)];
    this.voce(m,    t, 5.0, { tipo:'sine', vol:.42, attacco:.012, cutoff:3200 });
    this.voce(m+12, t, 3.2, { tipo:'sine', vol:.12, attacco:.010, cutoff:5000 });
    if(Math.random() < .35){                       // ogni tanto una seconda nota, sfasata
      const m2=a.scala[Math.floor(Math.random()*a.scala.length)];
      this.voce(m2, t + .28 + Math.random()*.5, 4.4,
                { tipo:'sine', vol:.28, attacco:.012, cutoff:3000 });
    }
  },

  programmaCampana(){
    this.campana();
    this.timerCampana = setTimeout(()=>this.programmaCampana(), 2400 + Math.random()*3600);
  },

  aggiorna(){
    if(!this.ctx || !this.fxGain || !this.musicaGain) return;
    const t=this.ctx.currentTime;
    if(this.ctx.state==='suspended' && (IMPOSTAZIONI.audio||IMPOSTAZIONI.ambient)) this.ctx.resume();
    this.fxGain.gain.cancelScheduledValues(t);
    this.fxGain.gain.linearRampToValueAtTime(IMPOSTAZIONI.audio ? 1 : 0, t+.15);
    this.musicaGain.gain.cancelScheduledValues(t);
    this.musicaGain.gain.linearRampToValueAtTime(Math.max(.0001, IMPOSTAZIONI.ambient), t+1.5);
  },

  pronto(){ return this.ctx && IMPOSTAZIONI.audio; },

  /* Il "toc" dei pulsanti */
  toc(){
    if(!this.pronto()) return;
    const c=this.ctx, t=c.currentTime;
    const o=c.createOscillator(); o.type='triangle';
    o.frequency.setValueAtTime(900,t);
    o.frequency.exponentialRampToValueAtTime(300,t+.07);
    const g=c.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.15,t+.006);
    g.gain.exponentialRampToValueAtTime(.0001,t+.10);
    o.connect(g); g.connect(this.fxGain); o.start(t); o.stop(t+.12);
  },

  /* L'onda di transizione fra una scena e l'altra */
  onda(){
    if(!this.pronto()) return;
    const c=this.ctx, t=c.currentTime;
    const src=c.createBufferSource(); src.buffer=this.rumore;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.1;
    f.frequency.setValueAtTime(180,t);
    f.frequency.exponentialRampToValueAtTime(1400,t+.28);
    f.frequency.exponentialRampToValueAtTime(220,t+.62);
    const g=c.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.085,t+.16);
    g.gain.exponentialRampToValueAtTime(.0001,t+.65);
    src.connect(f); f.connect(g); g.connect(this.fxGain);
    src.start(t); src.stop(t+.7);
  },

  /* Dadi che rotolano: una raffica di piccoli impulsi filtrati */
  dadi(dur){
    if(!this.pronto()) return;
    const c=this.ctx, n=11, passo=(dur||.85)/n;
    for(let i=0;i<n;i++){
      const t=c.currentTime + i*passo + Math.random()*.022;
      const src=c.createBufferSource(); src.buffer=this.rumore;
      src.playbackRate.value = .8+Math.random()*.6;
      const f=c.createBiquadFilter(); f.type='bandpass';
      f.frequency.value = 1100+Math.random()*2000; f.Q.value=7;
      const g=c.createGain();
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.09*(1-i/(n*1.6)),t+.004);
      g.gain.exponentialRampToValueAtTime(.0001,t+.075);
      src.connect(f); f.connect(g); g.connect(this.fxGain);
      src.start(t); src.stop(t+.09);
    }
  },

  /* Esito del tiro: arpeggio che sale se va bene, che scende se va male */
  esito(ok){
    if(!this.pronto()) return;
    const c=this.ctx, t=c.currentTime;
    (ok ? [523.25,659.25,830.61] : [349.23,277.18]).forEach((f,i)=>{
      const st=t+i*.085;
      const o=c.createOscillator(); o.type='sine'; o.frequency.value=f;
      const g=c.createGain();
      g.gain.setValueAtTime(.0001,st);
      g.gain.exponentialRampToValueAtTime(.11,st+.02);
      g.gain.exponentialRampToValueAtTime(.0001,st+.55);
      o.connect(g); g.connect(this.fxGain); o.start(st); o.stop(st+.6);
    });
  },

  /* Soldi che se ne vanno */
  spesa(){
    if(!this.pronto()) return;
    const c=this.ctx, t=c.currentTime;
    [1318.51,1760].forEach((f,i)=>{
      const st=t+i*.06;
      const o=c.createOscillator(); o.type='triangle'; o.frequency.value=f;
      const g=c.createGain();
      g.gain.setValueAtTime(.0001,st);
      g.gain.exponentialRampToValueAtTime(.07,st+.008);
      g.gain.exponentialRampToValueAtTime(.0001,st+.30);
      o.connect(g); g.connect(this.fxGain); o.start(st); o.stop(st+.34);
    });
  }
};

/* L'HUD cambia larghezza col contenuto (soldi a quattro cifre, oggetti nello
   zaino) e altezza col font. Capitolo, stamina e pannello dello zaino si
   posizionano su queste due misure invece che su numeri fissi, così non si
   sovrappongono mai, nemmeno se i font di Google arrivano in ritardo. */
function misuraHUD(){
  const h = document.getElementById('hud');
  if(!h) return;
  const r = h.getBoundingClientRect();
  if(!r.height) return;
  const st = document.documentElement.style;
  st.setProperty('--hud-h', Math.round(r.height) + 'px');
  st.setProperty('--hud-w', Math.round(r.width)  + 'px');
}
window.addEventListener('resize', misuraHUD);
window.addEventListener('orientationchange', () => setTimeout(misuraHUD, 250));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(misuraHUD);

/* ══════════════════════════════════════════════════════════════
   PRECARICO
   Appena una scena è a schermo, in sottofondo scarichiamo le immagini
   delle scene in cui si può andare da qui. Così quando premi un
   pulsante la foto è già pronta e non si vede più il ritardo.
   ══════════════════════════════════════════════════════════════ */
const PRECARICATE = [];

function destinazioni(s){
  const out = [];
  ['vai','avanti','tornaHub','vaiAltrimenti','vaiSconfitta']
    .forEach(k => { if(typeof s[k] === 'string') out.push(s[k]); });
  if(s.dado) ['vai','vaiAltrimenti','vaiSconfitta']
    .forEach(k => { if(s.dado[k]) out.push(s.dado[k]); });
  [...(s.scelte||[]), ...(s.interazioni||[]), ...[].concat(s.uscita||[])]
    .forEach(c => { if(c && c.vai) out.push(c.vai); });
  return [...new Set(out)];
}

function precaricaImmagine(nome){
  if(!nome) return;
  trovaImmagine(nome, url => {
    const im = new Image();
    im.src = url;
    PRECARICATE.push(im);
    if(PRECARICATE.length > 120) PRECARICATE.shift();   // non cresce all'infinito
  }, () => {});
}

function precaricaVicini(id){
  const s = SCENE[id];
  if(!s) return;
  destinazioni(s).forEach(d => {
    const v = SCENE[d];
    if(!v) return;
    precaricaImmagine(v.sfondo);
    precaricaImmagine(v.immagineFine);
    const p = v.chi && PERSONAGGI[v.chi];
    if(p) precaricaImmagine(p.foto);
  });
}

/* Feedback di un tap: suono + vibrazione */
function feedback(ms){

  if(IMPOSTAZIONI.vibra && navigator.vibrate) { try{ navigator.vibrate(ms||9); }catch(e){} }
}

/* ══════════════════════════════════════════════════════════════
   MACCHINA DA SCRIVERE
   Misura prima l'altezza del testo completo e la blocca, così il
   riquadro e il ritratto non ballano mentre le lettere compaiono.
   ══════════════════════════════════════════════════════════════ */
let typeTimer=null, typeFull='';

function scriviTesto(el, str){
  if(typeTimer){ clearInterval(typeTimer); typeTimer=null; }
  typeFull = str;
  el.style.minHeight='';
  el.textContent = str;
  const passo = IMPOSTAZIONI.testo;
  if(!passo) return;
  el.style.minHeight = el.offsetHeight + 'px';
  el.textContent='';
  let i=0;
  typeTimer=setInterval(()=>{
    el.textContent = str.slice(0, ++i);
    if(i>=str.length){ clearInterval(typeTimer); typeTimer=null; }
  }, passo);
}

function completaTesto(){
  if(!typeTimer) return false;
  clearInterval(typeTimer); typeTimer=null;
  document.getElementById('testo').textContent = typeFull;
  return true;
}

const CACHE_IMG={};
const ESTENSIONI=['.jpg','.jpeg','.png','.webp','.JPG','.JPEG','.PNG','.HEIC'];

/* L'estensione che ha funzionato l'ultima volta viene provata per prima.
   Nella cartella i file hanno tutti la stessa estensione, quindi dopo la
   prima immagine il gioco indovina sempre al primo colpo: prima invece
   sprecava una richiesta fallita (e su rete mobile un intero andata e
   ritorno) per ogni singola foto. */
const CHIAVE_EST = 'acquario_estensione';
let EST_PREFERITA = null;
try{ EST_PREFERITA = localStorage.getItem(CHIAVE_EST); }catch(e){}

function trovaImmagine(nome, ok, ko){
  if(CACHE_IMG[nome]!==undefined){
    CACHE_IMG[nome] ? ok(CACHE_IMG[nome]) : ko();
    return;
  }
  const base=nome.replace(/\.[^.]+$/,'');
  const ordine = EST_PREFERITA
    ? [EST_PREFERITA, ...ESTENSIONI.filter(e=>e!==EST_PREFERITA)]
    : ESTENSIONI;
  const candidati=[base+(EST_PREFERITA||''), nome, ...ordine.map(e=>base+e)]
    .filter(v=>v && v!==base)
    .filter((v,i,a)=>a.indexOf(v)===i);
  let i=0;
  const prova=()=>{
    if(i>=candidati.length){ CACHE_IMG[nome]=null; ko(); return; }
    const url=CARTELLA_IMG+candidati[i++];
    const im=new Image();
    im.onload =()=>{
      CACHE_IMG[nome]=url;
      const est=url.slice(url.lastIndexOf('.'));
      if(est!==EST_PREFERITA){
        EST_PREFERITA=est;
        try{ localStorage.setItem(CHIAVE_EST, est); }catch(e){}
      }
      ok(url);
    };
    im.onerror=prova;
    im.src=url;
  };
  prova();
}

const $=id=>document.getElementById(id);
const bg=$('bg'),bg2=$('bg2'),chapter=$('chapter'),charBox=$('char'),charImg=$('char-img'),plaque=$('plaque'),

/* Collezione permanente: i personaggi incontrati restano sbloccati anche

  const salv = JSON.parse(localStorage.getItem(CHIAVE_COLLEZIONE) || '[]');
  if(Array.isArray(salv)) COLLEZIONE = new Set(salv.filter(k => PERSONAGGI[k]));
}catch(e){ console.warn('ℹ️ Collezione personaggi non leggibile, riparto da zero.'); }

function salvaCollezione(){
  try{ localStorage.setItem(CHIAVE_COLLEZIONE, JSON.stringify([...COLLEZIONE])); }catch(e){}
}

const fmtEuro = v => v.toFixed(2).replace('.',',')+' \u20AC';

/* Hai quell'oggetto nello zaino? Base di seOggetto / seNonOggetto / seOggettoUno */
const haOggetto = o => ZAINO.includes(o);
const listaOgg  = v => [].concat(v || []);
const nomeOgg   = o => (OGGETTI[o] || {}).nome || o;

let STAMINA_PREC = null;   // per capire di quanto è cambiata e mostrare il "-15"

function aggiornaHUD(spesa){
  const inv=document.getElementById('inv'), eu=document.getElementById('euro'),
        stam=document.getElementById('stamina');
  inv.innerHTML = ZAINO.map(id=>{
    const o=OGGETTI[id]; if(!o) return '';
    return `<div class="slot" data-nome="${o.nome}">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="${o.d}"/></svg></div>`;
  }).join('');
  eu.textContent = fmtEuro(EURO);
  if(spesa){ AUDIO.spesa(); eu.classList.remove('speso'); void eu.offsetWidth; eu.classList.add('speso'); }

  /* Tasto zaino e suo pannello (visibili solo su schermi piccoli) */
  const zb = document.getElementById('zaino-btn');
  zb.querySelector('.zb-n').textContent = ZAINO.length;
  zb.classList.toggle('vuoto', ZAINO.length === 0);
  document.getElementById('zaino-lista').innerHTML = ZAINO.length
    ? ZAINO.map(id=>{
        const o=OGGETTI[id]; if(!o) return '';
        return `<div class="zp-riga">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="${o.d}"/></svg>
          <span>${o.nome}</span></div>`;
      }).join('')
    : '<div class="zp-vuoto">Non hai ancora raccolto niente.</div>';

  /* ── Barra stamina ─────────────────────────────────────────── */
  const val = Math.max(0, STAMINA);
  const pct = Math.max(0, Math.min(100, val / STAMINA_INIZIALE * 100));
  stam.querySelector('.stam-fill').style.width = pct + '%';
  stam.querySelector('.stam-val').textContent = val;
  stam.classList.toggle('bassa',   val < STAMINA_BASSA && val >= STAMINA_CRITICA);
  stam.classList.toggle('critica', val < STAMINA_CRITICA);

  const delta = STAMINA_PREC === null ? 0 : val - STAMINA_PREC;
  STAMINA_PREC = val;
  if(delta !== 0){
    stam.classList.remove('speso'); void stam.offsetWidth; stam.classList.add('speso');
    stam.querySelectorAll('.stam-delta').forEach(x=>x.remove());   // uno alla volta
    const d=document.createElement('span');
    d.className = 'stam-delta ' + (delta<0 ? 'giu' : 'su');
    d.textContent = (delta<0 ? '−' : '+') + Math.abs(delta);
    stam.appendChild(d);
    setTimeout(()=>d.remove(), 1300);
  }

  document.getElementById('hud').classList.add('show');
  stam.classList.add('show');
  misuraHUD();
}

function applica(x){
  if(!x) return;
  let speso=false;
  if(x.costo){ EURO=Math.max(0, EURO - x.costo); speso=true; }
  
  if(x.stamina){ STAMINA=Math.min(STAMINA_INIZIALE, STAMINA + x.stamina); }
  
  if(x.oggetto && !ZAINO.includes(x.oggetto)) ZAINO.push(x.oggetto);
  if(x.rimuovi) ZAINO=ZAINO.filter(o=>o!==x.rimuovi);
  if(x.costo||x.oggetto||x.rimuovi||x.stamina) aggiornaHUD(speso);
}

for(let i=0;i<22;i++){
  const b=document.createElement('div');b.className='bubble';
  const s=4+Math.random()*14;
  b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;
    animation-duration:${9+Math.random()*13}s;animation-delay:${-Math.random()*20}s`;
  stage.appendChild(b);
}

function nascondi(){
  chiudiZaino();
  if(typeTimer){ clearInterval(typeTimer); typeTimer=null; }
  testo.style.minHeight='';
  [chapter,charBox,plaque,titolo,testo,esito,stat,dadi].forEach(e=>e.classList.remove('show'));
  dadi.innerHTML='';
  scelte.innerHTML='';
}

function disegna(id){
  const s=SCENE[id];
  if(!s){console.error('Scena inesistente: '+id);return;}

  /* Camminare stanca: le scene marcate "spostamento" scalano stamina.
     spostamento:true usa STAMINA_MOVIMENTO, spostamento:12 usa 12. */
  if(s.spostamento && !s.finale){
    STAMINA = Math.max(0, STAMINA - (s.spostamento===true ? STAMINA_MOVIMENTO : s.spostamento));
    aggiornaHUD();
    if(STAMINA <= 0) return disegna('game_over');
  }

  if(s.imposta) Object.assign(STATO,s.imposta);
  applica(s);

  if(s.sfondo){
    trovaImmagine(s.sfondo,
      url => { bg.style.backgroundImage = `url('${url}')`;
               bg.style.backgroundPosition = s.fuoco || 'center 38%';
               bg2.style.backgroundImage = `url('${url}')`; },
      ()  => { bg.style.backgroundImage='none'; bg2.style.backgroundImage='none';
               console.warn(`⚠️ Sfondo non trovato: ${CARTELLA_IMG}${s.sfondo} (scena "${id}")`); });
  } else { bg.style.backgroundImage='none'; bg2.style.backgroundImage='none'; }
  chapter.textContent = s.capitolo||'';

  /* Track met characters for the options menu */
  if(s.chi && PERSONAGGI[s.chi]){
    met_characters.add(s.chi);
    if(!COLLEZIONE.has(s.chi)){ COLLEZIONE.add(s.chi); salvaCollezione(); }
    const p=PERSONAGGI[s.chi];
    if(p.foto){
      charImg.innerHTML=`<div class="emoji-box">${p.emoji}</div>`;
      trovaImmagine(p.foto,
        url => { charImg.innerHTML=`<img src="${url}" alt="${p.nome}">`; },
        ()  => { console.warn(`⚠️ Foto non trovata per "${p.nome}": ${CARTELLA_IMG}${p.foto}`); });
    } else {
      charImg.innerHTML=`<div class="emoji-box">${p.emoji}</div>`;
    }
    plaqueN.textContent=p.nome; plaqueL.textContent=p.latino;
    charBox.style.display='flex'; plaque.style.display='block';
  } else { charBox.style.display='none'; plaque.style.display='none'; }

  if(s.finale){
    esito.textContent=s.esitoLabel||(s.finale==='good'?'Good Ending':'Bad Ending');
    esito.className=s.finale;
  } else { esito.textContent=''; esito.className=''; }

  const riempi = t => t.replace(/\{(\w+)\}/g, (m,k)=> STATO[k] ?? m);
  titolo.textContent=riempi(s.titolo);
  let corpo=s.testo;
  if(s.progressivo){
    const i=Math.min(parlato.size,COMMENTI_PARCO.length)-1;
    if(i>=0) corpo += " " + COMMENTI_PARCO[i];
  }
  scriviTesto(testo, riempi(corpo));

  const contaHub = sc => sc.interazioni.filter(c=>parlato.has(c.id||c.vai)).length;
  if(s.finale){
    const p=SCENE.parco;
    stat.textContent=`Addetti all'assistenza disturbati: ${contaHub(p)} / ${p.interazioni.length}`;
  } else if(s.hub){
    const n=contaHub(s);
    stat.textContent = n ? `Domande già fatte: ${n} / ${s.interazioni.length}` : '';
  } else stat.textContent='';

  const visibile = c =>
    (!c.se    || Object.entries(c.se).every(([k,v])=>STATO[k]===v)) &&
    (!c.seNon || Object.entries(c.seNon).every(([k,v])=>STATO[k]!==v)) &&
    (!c.seNonTutte || !Object.entries(c.seNonTutte).every(([k,v])=>STATO[k]===v)) &&
    (!c.seAlmeno || Object.entries(c.seAlmeno.di)
        .filter(([k,v])=>STATO[k]===v).length >= c.seAlmeno.n) &&
    (!c.seMeno || Object.entries(c.seMeno.di)
        .filter(([k,v])=>STATO[k]===v).length < c.seMeno.n) &&
    (c.seEuroAlmeno==null || EURO >= c.seEuroAlmeno) &&
    (c.seEuroMeno==null   || EURO <  c.seEuroMeno) &&
    /* zaino: seOggetto = li hai TUTTI · seNonOggetto = non ne hai NESSUNO
              seOggettoUno = ne hai ALMENO UNO */
    (!c.seOggetto    || listaOgg(c.seOggetto).every(haOggetto)) &&
    (!c.seNonOggetto || !listaOgg(c.seNonOggetto).some(haOggetto)) &&
    (!c.seOggettoUno || listaOgg(c.seOggettoUno).some(haOggetto));

  const crea=(html,fn,extra='')=>{
    const b=document.createElement('button');
    b.className='btn '+extra; b.innerHTML=html;
    b.onclick=(ev)=>{ feedback(); fn(ev); };
    scelte.appendChild(b); return b;
  };
  const mostra=()=>[...scelte.children].forEach((b,i)=>{
    b.style.transitionDelay=(.08*i)+'s'; requestAnimationFrame(()=>b.classList.add('show'));
  });

  if(s.dado){
    const d=s.dado, n=d.n||2, facce=d.facce||6;
    let tentativi=0;
    const soglia = (v,t) => typeof v==='function' ? v(t)
                          : Array.isArray(v) ? v[Math.min(t,v.length-1)] : v;
    const etichetta = t => {
      const mi=soglia(d.min,t), ma=soglia(d.max,t), pre=d.etichetta?d.etichetta+' — ':'';
      if(mi!=null&&ma!=null) return `${pre}serve una somma tra ${mi} e ${ma}`;
      if(mi!=null)           return `${pre}serve una somma di almeno ${mi}`;
      if(ma!=null)           return `${pre}serve una somma non superiore a ${ma}`;
      return pre;
    };
    const cond = (v,t) => {
      const mi=soglia(d.min,t), ma=soglia(d.max,t);
      return (mi==null || v>=mi) && (ma==null || v<=ma);
    };

    dadi.innerHTML=`<div class="dado-cond">${etichetta(0)}</div>
      <div class="dado-riga">${Array.from({length:n},()=>'<div class="dado">?</div>').join('')}
      <div class="dado-somma"></div></div><div class="dado-esito"></div>`;
    const facceEl=[...dadi.querySelectorAll('.dado')],
          sommaEl=dadi.querySelector('.dado-somma'),
          esitoEl=dadi.querySelector('.dado-esito'),
          condEl =dadi.querySelector('.dado-cond');

    const lancia=()=>{
      scelte.innerHTML=''; esitoEl.textContent=''; esitoEl.className='dado-esito';
      sommaEl.textContent='';
      facceEl.forEach(f=>f.classList.add('tira'));
      AUDIO.dadi(.9);
      const tick=setInterval(()=>facceEl.forEach(f=>f.textContent=1+Math.floor(Math.random()*facce)),80);
      setTimeout(()=>{
        clearInterval(tick);
        const tiri=facceEl.map(()=>1+Math.floor(Math.random()*facce));
        facceEl.forEach((f,i)=>{f.classList.remove('tira');f.textContent=tiri[i];});
        const somma=tiri.reduce((a,b)=>a+b,0);
        sommaEl.innerHTML=`= <b>${somma}</b>`;
        STATO.tiro=somma;          
        const t=tentativi; tentativi++;
        
        if(cond(somma,t)){
          AUDIO.esito(true);
          esitoEl.textContent=riempi(d.successo); esitoEl.className='dado-esito ok';
          const b=crea('Continua →',()=>vai(d.vai),'avanti');
          requestAnimationFrame(()=>b.classList.add('show'));
        } else {
          AUDIO.esito(false);
          STAMINA -= STAMINA_LOSS;
          aggiornaHUD();

          if (STAMINA <= 0) {
            esitoEl.textContent = "La stanchezza ti ha sopraffatto...";
            const b = crea('Continua →', () => vai('game_over'), 'avanti');
            requestAnimationFrame(() => b.classList.add('show'));
            return; 
          }

          if(d.unico){
            esitoEl.textContent=riempi(d.altrimenti||'');
            const b=crea('Continua →',()=>vai(d.vaiAltrimenti),'avanti');
            requestAnimationFrame(()=>b.classList.add('show'));
          } else if(d.maxTentativi && tentativi >= d.maxTentativi) {
            const f=d.fallimenti||[]; 
            esitoEl.textContent=f[Math.min(tentativi-1,f.length-1)]||'Hai fallito.';
            condEl.textContent=etichetta(tentativi);
            const b=crea('Continua →',()=>vai(d.vaiSconfitta),'avanti');
            requestAnimationFrame(()=>b.classList.add('show'));
          } else {
            const f=d.fallimenti||[]; 
            esitoEl.textContent=f[Math.min(tentativi-1,f.length-1)]||'Non basta.';
            condEl.textContent=etichetta(tentativi);
            const b=crea('🎲 Rilancia',lancia,'avanti');
            requestAnimationFrame(()=>b.classList.add('show'));
          }
        }
      },900);
    };

    const b=crea(d.azione||'🎲 Lancia i dadi',lancia,'avanti');
    requestAnimationFrame(()=>b.classList.add('show'));
  }
  else if(s.hub){
    s.interazioni.filter(visibile).forEach((c,i)=>{
      const chiave=c.id||c.vai, fatto=parlato.has(chiave);
      const b = crea(`<span class="num">${i+1}</span>${fatto?'✓ ':''}${c.testo}`,
           ()=>{ if(b.classList.contains('fatto')) return;   // già usata: non si ripete
                 parlato.add(chiave);
                 /* Anche le voci degli hub possono costare soldi, dare stamina
                    o consegnare oggetti: prima venivano ignorate, così nei
                    padiglioni acqua e merendine non facevano niente. */
                 if(c.imposta) Object.assign(STATO,c.imposta);
                 applica(c);
                 vai(c.vai); }, fatto?'fatto':'');
      /* Una voce col segno di spunta è chiusa: senza questo si poteva
         ricomprare la stessa acqua o rifare la stessa scena all'infinito. */
      if(fatto){ b.disabled = true; b.setAttribute('aria-disabled','true'); }
    });
    [].concat(s.uscita).filter(visibile).forEach(u=>
      crea(u.testo,()=>{ if(u.imposta) Object.assign(STATO,u.imposta);
                         applica(u); vai(u.vai); },'uscita'));
  } else if(s.finale){
    crea('▸ Fine', ()=>apriFine(s), 'avanti');
  } else if(s.tornaHub){
    crea(s.tornaTesto||'← Torna a girovagare',()=>vai(s.tornaHub),'avanti');
  } else if(s.avanti){
    crea('Continua →',()=>vai(s.avanti),'avanti');
  } else {
    s.scelte.filter(visibile).forEach((c,i)=>crea(`<span class="num">${i+1}</span>${c.testo}`,
      ()=>{ if(c.imposta) Object.assign(STATO,c.imposta); applica(c); vai(c.vai); }));
  }
  mostra();

  requestAnimationFrame(()=>{
    const box=document.getElementById('box');
    if(box) document.documentElement.style.setProperty('--box-h', box.offsetHeight+'px');
  });

  requestAnimationFrame(()=>{
    chapter.classList.add('show'); titolo.classList.add('show');
    testo.classList.add('show'); esito.classList.add('show'); stat.classList.add('show');
    dadi.classList.add('show');
    if(s.chi){ charBox.classList.add('show'); plaque.classList.add('show'); }
  });

  /* con un attimo di ritardo, così non ruba banda all'immagine di questa scena */
  SCENA_ATTUALE = id;
  salvaPartita();
  controllaTrofei();

  setTimeout(()=>precaricaVicini(id), 400);
}

function vai(id){
  AUDIO.onda();
  const durata = IMPOSTAZIONI.animazioni ? 700 : 60;
  wave.classList.add('up'); nascondi();
  
  /* Preload images instantly during the wave transition */
  const s = SCENE[id];
  if(s) {
    if(s.sfondo) precaricaImmagine(s.sfondo);
    if(s.chi && PERSONAGGI[s.chi] && PERSONAGGI[s.chi].foto) precaricaImmagine(PERSONAGGI[s.chi].foto);
  }

  setTimeout(()=>{ disegna(id); setTimeout(()=>wave.classList.remove('up'),90); }, durata);
}

/* ══════════════════════════════════════════════════════════════
   SCHERMATA DI FINE
   Si apre quando premi "Fine" su una scena con finale:"good"/"bad".
   L'immagine viene da s.immagineFine e si cerca in CARTELLA_IMG con
   la stessa tolleranza sulle estensioni degli altri sfondi: se il
   file non c'è ancora, resta il fondo blu e la schermata funziona
   lo stesso.
   ══════════════════════════════════════════════════════════════ */
let FINALE_CORRENTE = null;

function apriFine(s){
  cancellaPartita();          // la giornata è finita: niente da riprendere
  FINALE_CORRENTE = s;

  /* sblocca il finale nella galleria */
  const chiave = Object.keys(SCENE).find(k => SCENE[k] === s);
  if(chiave && !FINALI_VISTI.has(chiave)){ FINALI_VISTI.add(chiave); salvaFinali(); }
  controllaTrofei();
  const scr   = document.getElementById('fine-screen');
  const img   = document.getElementById('fine-img');
  const lab   = document.getElementById('fine-label');
  const tit   = document.getElementById('fine-titolo');
  const riep  = document.getElementById('fine-riepilogo');

  riep.classList.remove('show');
  img.style.backgroundImage = 'none';
  if(s.immagineFine){
    trovaImmagine(s.immagineFine,
      url => { img.style.backgroundImage = `url('${url}')`; },
      ()  => { console.warn(`⚠️ Immagine di fine non trovata: ${CARTELLA_IMG}${s.immagineFine}`); });
  }

  lab.textContent = s.esitoLabel || (s.finale==='good' ? 'Good Ending' : 'Bad Ending');
  lab.className   = s.finale;
  tit.textContent = s.titolo || '';

  /* HUD e capitolo spariscono: qui la giornata è chiusa */
  document.getElementById('hud').classList.remove('show');
  document.getElementById('stamina').classList.remove('show');
  document.getElementById('chapter').classList.remove('show');

  scr.style.display='flex';
  requestAnimationFrame(()=>requestAnimationFrame(()=>scr.classList.add('show')));
}

function chiudiFine(){
  const scr=document.getElementById('fine-screen');
  scr.classList.remove('show');
  document.getElementById('fine-riepilogo').classList.remove('show');
  setTimeout(()=>{ scr.style.display='none'; }, IMPOSTAZIONI.animazioni ? 900 : 60);
}

/* Riepilogo: personaggi, timbri, oggetti, soldi, stamina */
function costruisciRiepilogo(){
  const chip = (testo, ok, pathSvg) =>
    `<span class="riep-chip ${ok?'':'no'}">`+
    (pathSvg ? `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${pathSvg}"/></svg>` : '')+
    `${testo}</span>`;

  const chiaviPers = Object.keys(PERSONAGGI);
  const incontrati = chiaviPers.filter(k => met_characters.has(k));
  const timbriPresi = STAMPS_KEYS.filter(t => ZAINO.includes(t.obj) || STATO[t.key]==='fatto');
  const oggetti = ZAINO.filter(o => OGGETTI[o] && !STAMPS_KEYS.some(t=>t.obj===o));
  /* Fantasmi incontrati: i tre del laghetto più Vania, che si incontra
     all'ingresso del Padiglione Viola e non passa da STATO. */
  const FANTASMI = ['cesare','elena','maria','vania'];
  const fantasmiVisti = FANTASMI.filter(k =>
    STATO[k] === 'visto' || met_characters.has(k)).length;
  const cifre = [
    ['Soldi rimasti',   fmtEuro(EURO)],
    ['Stamina',         Math.max(0,STAMINA) + ' / ' + STAMINA_INIZIALE],
    ['Personaggi',      incontrati.length + ' / ' + chiaviPers.length],
    ['Timbri',          timbriPresi.length + ' / ' + STAMPS_KEYS.length],
    ['Oggetti',         String(oggetti.length)],
    ['Fantasmi incontrati', fantasmiVisti + ' / ' + FANTASMI.length]
  ];

  document.getElementById('riep-corpo').innerHTML = `
    <h3 class="riep-titolo">La tua giornata all'Acquario</h3>
    <div class="riep-sub">${FINALE_CORRENTE ? (FINALE_CORRENTE.esitoLabel||'') : ''}</div>

    <div class="riep-cifre">
      ${cifre.map(([k,v])=>`<div class="riep-cifra"><div class="v">${v}</div><div class="k">${k}</div></div>`).join('')}
    </div>

    <div class="riep-sez">
      <h4>Timbri ottenuti — ${timbriPresi.length} su ${STAMPS_KEYS.length}</h4>
      ${STAMPS_KEYS.map(t=>{
        const preso = timbriPresi.includes(t);
        return chip(t.label, preso, preso ? (SAGOME[t.key] || (OGGETTI[t.obj]||{}).d) : SVG_LUCCHETTO);
      }).join('')}
    </div>

    <div class="riep-sez">
      <h4>Oggetti nello zaino — ${oggetti.length}</h4>
      ${oggetti.length
        ? oggetti.map(o=>chip(OGGETTI[o].nome, true, OGGETTI[o].d)).join('')
        : '<div class="riep-vuoto">Sei uscito dall\'acquario esattamente come sei entrato.</div>'}
    </div>

    <div class="riep-sez">
      <h4>Persone incontrate oggi — ${incontrati.length} su ${chiaviPers.length}</h4>
      ${chiaviPers.map(k=>chip(PERSONAGGI[k].nome, met_characters.has(k))).join('')}
    </div>

    <div class="riep-azioni">
      <button id="riep-condividi">Condividi il risultato</button>
    </div>`;

  document.getElementById('riep-condividi').onclick = () => { feedback(); condividiRisultato(cifre, timbriPresi, incontrati); };
}

/* Condivisione: usa il pannello di sistema se c'è (telefoni), altrimenti
   copia il testo negli appunti. Se anche quello manca, lo mostra da leggere. */
function condividiRisultato(cifre, timbriPresi, incontrati){
  const esito = FINALE_CORRENTE ? (FINALE_CORRENTE.esitoLabel || FINALE_CORRENTE.titolo || '') : '';
  const testo =
    `🐟 Una giornata all'Acquario\n` +
    (esito ? `Finale: ${esito}\n` : '') + `\n` +
    cifre.map(([k,v]) => `${k}: ${v}`).join('\n') +
    `\n\nProva anche tu: ${location.href}`;

  const fatto = (msg) => {
    const b = document.getElementById('riep-condividi');
    if(!b) return;
    const prima = b.textContent;
    b.textContent = msg;
    setTimeout(()=>{ b.textContent = prima; }, 2200);
  };

  if(navigator.share){
    navigator.share({ title: "Una giornata all'Acquario", text: testo })
      .catch(()=>{});               // se annulli la condivisione non succede nulla
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(testo)
      .then(()=> fatto('Copiato negli appunti'))
      .catch(()=> fatto('Non riesco a copiare'));
    return;
  }
  window.prompt('Copia il tuo risultato:', testo);
}

(()=>{
  const uscite = v => ['dado','hub','finale','tornaHub','avanti','scelte'].filter(k=>v[k]);
  Object.entries(SCENE).forEach(([k,v])=>{
    const u=uscite(v);
    if(u.length>1) console.warn(`⚠️ La scena "${k}" ha più vie d'uscita (${u.join(' + ')}): il motore userà solo "${u[0]}", le altre non compariranno.`);
    if(!u.length)  console.warn(`⚠️ La scena "${k}" non porta da nessuna parte: è un vicolo cieco.`);
    const dest=[];
    if(v.avanti)dest.push(v.avanti); if(v.tornaHub)dest.push(v.tornaHub); if(v.dado){dest.push(v.dado.vai); if(v.dado.vaiAltrimenti)dest.push(v.dado.vaiAltrimenti); if(v.dado.vaiSconfitta)dest.push(v.dado.vaiSconfitta);}
    (v.scelte||[]).forEach(c=>dest.push(c.vai)); (v.interazioni||[]).forEach(c=>dest.push(c.vai));
    if(v.uscita)[].concat(v.uscita).forEach(u=>dest.push(u.vai));
    dest.forEach(d=>{ if(!SCENE[d]) console.error(`❌ La scena "${k}" punta a "${d}", che non esiste.`); });
    if(v.chi && !PERSONAGGI[v.chi]) console.error(`❌ La scena "${k}" usa il personaggio "${v.chi}", che non esiste.`);
  });
  /* Alcune scene non sono collegate da nessun link fra scene: ci si arriva
     da codice. game_over, per esempio, scatta quando la stamina tocca zero.
     Vanno messe qui, altrimenti il controllo qui sotto le segnala come
     irraggiungibili pur essendo perfettamente giocabili. */
  const RAGGIUNTE_DA_CODICE = ['game_over'];
  RAGGIUNTE_DA_CODICE.forEach(k=>{
    if(!SCENE[k]) console.error(`❌ "${k}" è indicata come raggiungibile da codice, ma la scena non esiste.`);
  });

  const visti=new Set(), coda=['casse', ...RAGGIUNTE_DA_CODICE];
  while(coda.length){ const c=coda.pop(); if(visti.has(c)||!SCENE[c])continue; visti.add(c); const v=SCENE[c];
    const d=[]; if(v.avanti)d.push(v.avanti); if(v.tornaHub)d.push(v.tornaHub); if(v.dado){d.push(v.dado.vai); if(v.dado.vaiAltrimenti)d.push(v.dado.vaiAltrimenti); if(v.dado.vaiSconfitta)d.push(v.dado.vaiSconfitta);}
    (v.scelte||[]).forEach(x=>d.push(x.vai)); (v.interazioni||[]).forEach(x=>d.push(x.vai));
    if(v.uscita)[].concat(v.uscita).forEach(u=>d.push(u.vai)); d.forEach(x=>coda.push(x)); }
  Object.keys(SCENE).filter(x=>!visti.has(x)).forEach(x=>
    console.warn(`⚠️ La scena "${x}" non è raggiungibile da nessun percorso.`));
  
  const chiavi=new Set();
  Object.values(SCENE).forEach(v=>{
    if(v.imposta)Object.keys(v.imposta).forEach(x=>chiavi.add(x));
    (v.scelte||[]).forEach(c=>c.imposta&&Object.keys(c.imposta).forEach(x=>chiavi.add(x)));
  });
  Object.entries(SCENE).forEach(([k,v])=>{
    [...(v.scelte||[]),...(v.interazioni||[]),...[].concat(v.uscita||[])].forEach(c=>{
      const usate=[...Object.keys(c.se||{}),...Object.keys(c.seNon||{}),
                   ...Object.keys(c.seNonTutte||{}),...Object.keys((c.seAlmeno||{}).di||{})];
      usate.forEach(x=>{ if(!chiavi.has(x))
        console.error(`❌ La scena "${k}" ha una condizione su "${x}", che nessuna scena imposta: quella voce non comparirà mai.`); });
    });
    const m=((v.titolo||'')+' '+(v.testo||'')).match(/\{(\w+)\}/g);
    if(m)m.forEach(x=>{ const n=x.slice(1,-1);
      if(!chiavi.has(n)) console.error(`❌ La scena "${k}" usa {${n}}, che nessuna scena imposta.`); });
  });
  /* Controlli sullo zaino: seOggetto / seNonOggetto / seOggettoUno */
  const dati=new Set();
  Object.values(SCENE).forEach(v=>{
    if(v.oggetto) dati.add(v.oggetto);
    (v.scelte||[]).forEach(c=>c.oggetto&&dati.add(c.oggetto));
    (v.interazioni||[]).forEach(c=>c.oggetto&&dati.add(c.oggetto));
  });
  const ctrlOgg=(k,o,dove,esigito)=>{
    if(!OGGETTI[o])      console.error(`❌ La scena "${k}" ${dove} l'oggetto "${o}", che non esiste in OGGETTI.`);
    else if(esigito && !dati.has(o))
      console.error(`❌ La scena "${k}" ${dove} "${o}", che nessuna scena consegna: quella voce non comparirà mai.`);
  };
  Object.entries(SCENE).forEach(([k,v])=>{
    [...(v.scelte||[]),...(v.interazioni||[]),...[].concat(v.uscita||[])].forEach(c=>{
      [].concat(c.seOggetto||[]).forEach(o=>ctrlOgg(k,o,'richiede',true));
      [].concat(c.seOggettoUno||[]).forEach(o=>ctrlOgg(k,o,'richiede',false));
      [].concat(c.seNonOggetto||[]).forEach(o=>ctrlOgg(k,o,'esclude',false));
    });
    if(v.rimuovi && !dati.has(v.rimuovi))
      console.warn(`⚠️ La scena "${k}" rimuove "${v.rimuovi}", che nessuna scena consegna.`);
  });

  const trans=Object.entries(SCENE).filter(([,v])=>v.spostamento);
  console.log(`✅ Controllo storia completato: ${Object.keys(SCENE).length} scene, `+
    `di cui ${trans.length} di transito: ${trans.map(([k])=>k).join(', ')}. `+
    `Costo stamina ${STAMINA_MOVIMENTO} l'una (ritorno_parco si attraversa una volta per padiglione).`);
})();

/* Il controllo qui sotto verifica che tutte le immagini esistano, e per farlo
   deve scaricarle tutte. In locale è comodo; online significa scaricare
   l'intera cartella img prima ancora di premere "Entra" — su telefono voleva
   dire minuti di attesa e schermata bianca. Quindi gira solo in sviluppo. */
const IN_SVILUPPO = location.protocol === 'file:' ||
  /^(localhost|127\.|0\.0\.0\.0|192\.168\.|10\.|\[::1\])/.test(location.hostname);

(()=>{
  if(!IN_SVILUPPO){
    console.log('ℹ️ Controllo immagini saltato: online le foto si caricano una alla volta, '+
                'quando servono. Apri il file in locale per la verifica completa.');
    return;
  }
  const sfondi=[...new Set(Object.values(SCENE).map(v=>v.sfondo).filter(Boolean))];
  const foto=[...new Set(Object.values(PERSONAGGI).map(p=>p.foto).filter(Boolean))];
  const finali=[...new Set(Object.values(SCENE).map(v=>v.immagineFine).filter(Boolean))];
  const tutti=[...sfondi.map(f=>({f,tipo:'sfondo'})),...foto.map(f=>({f,tipo:'foto'})),
               ...finali.map(f=>({f,tipo:'schermata di fine'}))];
  if(!tutti.length){ console.log('ℹ️ Nessuna immagine impostata: il gioco usa fondi blu ed emoji.'); return; }
  let ok=0, rinominati=[], mancanti=[], rimasti=tutti.length;
  const fine=()=>{
    if(--rimasti>0) return;
    console.log(`✅ Immagini trovate: ${ok} su ${tutti.length}.`);
    if(rinominati.length){
      console.log(`ℹ️ ${rinominati.length} file hanno un'estensione diversa da quella scritta nel codice. `+
        `Funzionano lo stesso, ma se vuoi puoi allineare i nomi:`);
      rinominati.forEach(r=>console.log(`   • nel codice "${r.f}"  →  sul disco "${r.url.replace(CARTELLA_IMG,'')}"`));
    }
    if(mancanti.length){
      console.error(`❌ Immagini mancanti: ${mancanti.length}. Devono stare in "${CARTELLA_IMG.replace('/','')}", `+
        `accanto al file .html:`);
      mancanti.forEach(m=>console.error(`   • ${m.f}   (${m.tipo})`));
    }
    const crossed=Object.entries(SCENE).filter(([,v])=>!v.sfondo).map(([k])=>k);
    if(crossed.length) console.log(`ℹ️ ${crossed.length} scene su ${Object.keys(SCENE).length} non hanno ancora uno sfondo `+
      `(restano sul fondo blu). Le prime: ${crossed.slice(0,8).join(', ')}…`);
  };
  tutti.forEach(m=>trovaImmagine(m.f,
    url=>{ ok++; if(url!==CARTELLA_IMG+m.f) rinominati.push({f:m.f,url}); fine(); },
    ()=>{ mancanti.push(m); fine(); }));
})();

/* ══════════════════════════════════════════════════════════════
   SALVATAGGIO DELLA PARTITA
   Ogni scena viene salvata al volo: se chiudi il gioco a metà, dal
   titolo trovi "Riprendi" e ricominci esattamente da lì. Il salvataggio
   sparisce quando arrivi a un finale o quando cominci una partita nuova.
   ══════════════════════════════════════════════════════════════ */
const CHIAVE_PARTITA = 'acquario_partita';
let SCENA_ATTUALE = null;

function salvaPartita(){
  if(!SCENA_ATTUALE) return;
  const s = SCENE[SCENA_ATTUALE];
  if(!s || s.finale) return;                 // ai finali non si torna
  try{
    localStorage.setItem(CHIAVE_PARTITA, JSON.stringify({
      scena: SCENA_ATTUALE,
      stato: STATO,
      euro: EURO,
      stamina: STAMINA,
      zaino: ZAINO,
      parlato: [...parlato],
      incontrati: [...met_characters],
      capitolo: s.capitolo || '',
      quando: Date.now()
    }));
  }catch(e){}
}

function leggiPartita(){
  try{
    const d = JSON.parse(localStorage.getItem(CHIAVE_PARTITA) || 'null');
    if(d && d.scena && SCENE[d.scena]) return d;
  }catch(e){}
  return null;
}

function cancellaPartita(){
  try{ localStorage.removeItem(CHIAVE_PARTITA); }catch(e){}
  aggiornaRiprendi();
}

/* Mostra o nasconde il pulsante sul titolo, con capitolo e data */
function aggiornaRiprendi(){
  const b = document.getElementById('riprendi');
  const i = document.getElementById('riprendi-info');
  if(!b || !i) return;
  const d = leggiPartita();
  b.classList.toggle('c-e', !!d);
  i.classList.toggle('c-e', !!d);
  if(!d) return;
  const g = new Date(d.quando);
  const quando = g.toLocaleDateString('it-IT', {day:'numeric', month:'long'}) +
                 ' alle ' + g.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
  i.textContent = `Partita lasciata ${d.capitolo ? 'in «'+d.capitolo+'»' : 'a metà'} · ${quando}`;
}

function riprendiPartita(){
  const d = leggiPartita();
  if(!d) return;
  STATO = d.stato || {};
  EURO = typeof d.euro === 'number' ? d.euro : SOLDI_INIZIALI;
  STAMINA = typeof d.stamina === 'number' ? d.stamina : STAMINA_INIZIALE;
  STAMINA_PREC = STAMINA;                    // niente popup del delta al rientro
  ZAINO = Array.isArray(d.zaino) ? d.zaino.filter(o => OGGETTI[o]) : [];
  parlato = new Set(d.parlato || []);
  met_characters = new Set((d.incontrati || []).filter(k => PERSONAGGI[k]));
  aggiornaHUD();
  disegna(d.scena);
}

/* ══════════════════════════════════════════════════════════════
   PREMESSA
   Schermata nera fra il titolo e la prima scena. Il testo compare
   in dissolvenza, dopo qualche secondo arriva la battuta finale.
   Un click salta tutto. Con "Animazioni: Ridotte" i tempi si
   accorciano, ma la premessa resta leggibile.
   ══════════════════════════════════════════════════════════════ */
const PREMESSA_TESTO =
  "I personaggi di questa storia sono reali. Ogni riferimento a fatti " +
  "e persone è assolutamente voluto. Il gioco vuole prendersi gioco " +
  "dei clienti che nel corso dell'estate ci hanno fatto dannare, e non " +
  "intende in alcun modo schernire nessuno dei lavoratori dell'Acquario.";

let premessaTimer = [];

function mostraPremessa(poi){
  const scr = document.getElementById('premessa');
  const txt = document.getElementById('premessa-testo');
  const coda= document.getElementById('premessa-coda');
  const lento = IMPOSTAZIONI.animazioni;

  txt.textContent = PREMESSA_TESTO;
  txt.classList.remove('on'); coda.classList.remove('on');
  scr.classList.add('show');

  let fatto = false;
  const chiudi = () => {
    if(fatto) return; fatto = true;
    premessaTimer.forEach(clearTimeout); premessaTimer = [];
    scr.removeEventListener('click', chiudi);
    const q = lento ? 1 : .25;

    /* 1. le parole svaniscono, il nero resta pieno */
    scr.classList.add('uscita');
    /* 2. la prima scena viene disegnata sotto, ancora al buio */
    setTimeout(()=>{ poi(); }, 520*q);
    /* 3. il nero si alza e la scena è già lì */
    setTimeout(()=>{ scr.classList.remove('show'); }, 760*q);
    setTimeout(()=>{ scr.style.display=''; scr.classList.remove('uscita'); }, 2000*q);
  };
  scr.addEventListener('click', chiudi);

  const t = (ms, fn) => premessaTimer.push(setTimeout(fn, lento ? ms : ms*0.25));
  t(700,  ()=> txt.classList.add('on'));
  t(6500, ()=> coda.classList.add('on'));   // la pausa prima della battuta
  t(10500, chiudi);
}

/* Da chiamare quando qualcosa può averne fatto scattare uno */
function controllaTrofei(){
  let nuovi = 0;
  /* Due passate: nella prima si sbloccano i trofei normali, nella
     seconda il platino può accorgersi che ora ci sono tutti. */
  for(let giro = 0; giro < 2; giro++){
    TROFEI.forEach(t => {
      if(TROFEI_PRESI.has(t.id)) return;
      let ok = false;
      try{ ok = !!t.prova(); }catch(e){}
      if(ok){ TROFEI_PRESI.add(t.id); nuovi++; }
    });
  }
  if(nuovi){ salvaTrofei(); console.log(`🏆 ${nuovi} trofeo/i sbloccato/i.`); }
}

function populateTrofei(){
  const cont = document.getElementById('trofei-container');
  if(!cont) return;
  const presi = TROFEI.filter(t => TROFEI_PRESI.has(t.id)).length;
  cont.innerHTML = `<div class="char-conta">Trofei: ${presi} su ${TROFEI.length}</div>` +
    TROFEI.map(t => {
      const ok = TROFEI_PRESI.has(t.id);
      return `<div class="trofeo${ok ? ' preso' : ''}${t.platino ? ' platino' : ''}">
        <div class="tr-ico">${ok ? t.ico : '🔒'}</div>
        <div class="tr-info">
          <span class="tr-nome">${ok ? t.nome : '???'}</span>
          <span class="tr-desc">${t.desc}</span>
        </div>
      </div>`;
    }).join('');
}

const CHIAVE_FINALI = 'acquario_finali';

try{
  const salv = JSON.parse(localStorage.getItem(CHIAVE_FINALI) || '[]');
  if(Array.isArray(salv)) FINALI_VISTI = new Set(salv.filter(k => SCENE[k] && SCENE[k].finale));
}catch(e){ console.warn('ℹ️ Galleria finali non leggibile, riparto da zero.'); }

function salvaFinali(){
  try{ localStorage.setItem(CHIAVE_FINALI, JSON.stringify([...FINALI_VISTI])); }catch(e){}
}

/* Tutti i finali del gioco, in ordine di comparsa nel file */
function elencoFinali(){
  return Object.keys(SCENE).filter(k => SCENE[k].finale);
}

function populateFinali(){
  const cont = document.getElementById('finali-container');
  const tutti = elencoFinali();
  const visti = tutti.filter(k => FINALI_VISTI.has(k));
  cont.innerHTML = `<div class="char-conta">Finali trovati: ${visti.length} su ${tutti.length}
    · ogni finale resta sbloccato per sempre</div>` +
    tutti.map(k => {
      const s = SCENE[k];
      const ok = FINALI_VISTI.has(k);
      const buono = s.finale === 'good';
      return `<div class="fin-item${ok ? ' visto' : ''}${ok ? ' apribile' : ''}"
                   ${ok ? `data-fine="${k}"` : ''}>
        <div class="fin-ico">${ok ? (buono ? '🏆' : '💀') : '🔒'}</div>
        <div class="fin-info">
          <span class="fin-nome">${ok ? (s.titolo || '') : '???'}</span>
          <span class="fin-lab ${buono ? 'buono' : 'cattivo'}">${ok ? (s.esitoLabel || '') : 'Finale non ancora trovato'}</span>
        </div>
      </div>`;
    }).join('');

  cont.querySelectorAll('.fin-item.apribile').forEach(el => {
    el.addEventListener('click', () => mostraFinale(el.dataset.fine));
  });
}

/* Riusa lo stesso riquadro della foto dei personaggi */
function mostraFinale(chiave){
  const s = SCENE[chiave];
  if(!s) return;
  feedback();
  const scr = document.getElementById('char-foto');
  const box = document.getElementById('cf-img');
  document.getElementById('cf-nome').textContent   = s.titolo || '';
  document.getElementById('cf-latino').textContent = s.esitoLabel || '';
  document.getElementById('cf-nota').textContent   = '';
  box.innerHTML = `<div class="cf-emoji">${s.finale === 'good' ? '🏆' : '💀'}</div>`;

  const img = s.immagineFine || s.sfondo;
  if(img){
    trovaImmagine(img,
      url => { box.innerHTML = `<img src="${url}" alt="${s.titolo || ''}">`; },
      ()  => { document.getElementById('cf-nota').textContent = 'Immagine non disponibile'; });
  } else {
    document.getElementById('cf-nota').textContent = 'Immagine non disponibile';
  }
  scr.style.display = '';
  scr.classList.add('show');
}

function populateStamps() {

  container.innerHTML = '';
  STAMPS_KEYS.forEach(stamp => {
    const isAcquired = STATO[stamp.key] === "fatto";
    const cssClass = isAcquired ? "stamp-item acquired" : "stamp-item locked";
    const svgPath = isAcquired ? (SAGOME[stamp.key] || OGGETTI[stamp.obj].d) : SVG_LUCCHETTO;
    
    container.innerHTML += `
      <div class="${cssClass}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="${svgPath}"/></svg>
        <span>${stamp.label}</span>
      </div>
    `;
  });
}

/* Due modi diversi per la stessa scheda:
   · 'collezione' — si apre dal titolo, mostra il totale sbloccato di sempre
   · 'run'        — si apre dal menu in partita, mostra chi hai incontrato
                    oggi e chi ti manca ancora, senza contatori di collezione */
let MODO_SCHEDA = 'run';

function populateCharacters(modo) {
  if(modo) MODO_SCHEDA = modo;
  const collezione = MODO_SCHEDA === 'collezione';
  const container = document.getElementById('char-container');
  const totale = Object.keys(PERSONAGGI).length;

  if(collezione){
    const sbloccati = Object.keys(PERSONAGGI).filter(k => COLLEZIONE.has(k)).length;
    container.innerHTML = `<div class="char-conta">Collezione: ${sbloccati} su ${totale}
      · una volta incontrato, un personaggio resta sbloccato per sempre</div>`;
  } else {
    container.innerHTML = '';
  }

  Object.entries(PERSONAGGI).forEach(([key, p]) => {
    const scoperto = COLLEZIONE.has(key);        // sbloccato in una partita qualsiasi
    const oggi     = met_characters.has(key);    // incontrato in questa partita
    const acceso   = collezione ? scoperto : oggi;
    const nome     = scoperto ? p.nome : "???";

    container.innerHTML += `
      <div class="char-item${acceso ? ' met' : ''}${scoperto ? ' apribile' : ''}"
           ${scoperto ? `data-chi="${key}"` : ''}>
        <div class="char-icon">${p.emoji}</div>
        <div class="char-info">
          <span class="char-name">${nome}</span>
          <span class="char-latin">${scoperto ? p.latino : '—'}</span>
        </div>
      </div>
    `;
  });

  /* toccando una scheda sbloccata si apre la foto */
  container.querySelectorAll('.char-item.apribile').forEach(el => {
    el.addEventListener('click', () => mostraFotoPersonaggio(el.dataset.chi));
  });
}

/* ══════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════ */
function mostraFotoPersonaggio(chiave){
  const p = PERSONAGGI[chiave];
  if(!p) return;
  feedback();
  const scr = document.getElementById('char-foto');
  const box = document.getElementById('cf-img');

  document.getElementById('cf-nome').textContent   = p.nome;
  document.getElementById('cf-latino').textContent = p.latino || '';
  document.getElementById('cf-nota').textContent   = '';
  box.innerHTML = `<div class="cf-emoji">${p.emoji || '🐟'}</div>`;

  if(p.foto){
    trovaImmagine(p.foto,
      url => { box.innerHTML = `<img src="${url}" alt="${p.nome}">`; },
      ()  => { document.getElementById('cf-nota').textContent = 'Foto non disponibile'; });
  } else {
    document.getElementById('cf-nota').textContent = 'Foto non disponibile';
  }

  scr.style.display = '';
  scr.classList.add('show');
}

function chiudiFotoPersonaggio(){
  const scr = document.getElementById('char-foto');
  scr.classList.remove('show');
  setTimeout(()=>{ scr.style.display=''; }, IMPOSTAZIONI.animazioni ? 350 : 40);
}

function populateOptions() {
  const container = document.getElementById('opts-container');
  container.innerHTML = OPZIONI.map(o => `
    <div class="opt-row">
      <div>
        <div class="opt-label">${o.label}</div>
        <div class="opt-desc">${o.desc}</div>
      </div>
      <div class="opt-ctrl" data-k="${o.k}">
        ${o.valori.map(([et,v],i)=>
          `<button data-i="${i}" class="${IMPOSTAZIONI[o.k]===v?'on':''}">${et}</button>`
        ).join('')}
      </div>
    </div>`).join('');

  const et = document.getElementById('opt-versione');
  if(et) et.textContent = 'Versione ' + VERSIONE_GIOCO;

  const nv = document.getElementById('opt-novita');
  if(nv) nv.onclick = () => { feedback(); closeMenu(); setTimeout(mostraNovita, 250); };

  const rst = document.getElementById('opt-reset');
  if(rst) rst.onclick = () => {
    try{ localStorage.removeItem(CHIAVE_OPZ); }catch(e){}
    Object.assign(IMPOSTAZIONI, DEFAULT_OPZ);
    try{ applicaImpostazioni(); }catch(e){}
    location.reload();
  };

  container.querySelectorAll('.opt-ctrl').forEach(ctrl => {
    const opt = OPZIONI.find(o => o.k === ctrl.dataset.k);
    ctrl.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        IMPOSTAZIONI[opt.k] = opt.valori[+b.dataset.i][1];
        salvaImpostazioni();
        /* Ogni effetto è isolato: se uno fallisce — audio non disponibile,
           schermo intero rifiutato dal telefono — gli altri proseguono e il
           menu resta utilizzabile invece di piantarsi a metà. */
        try{ applicaImpostazioni(); }catch(e){ console.warn('ℹ️ Impostazione non applicata:', e.message); }
        if(opt.k === 'schermo'){ try{ applicaSchermo(); }catch(e){} }
        ctrl.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        try{ feedback(); }catch(e){}
      });
    });
  });
}

/* ══════════════════════════════════════════════════════════════
   TITOLI DI CODA
   I nomi si generano da PERSONAGGI: se ne aggiungi uno compare
   qui dentro da solo, senza toccare niente.
   ══════════════════════════════════════════════════════════════ */
function costruisciCrediti(){
  const persone = Object.values(PERSONAGGI)
    .filter(p => p && p.nome)
    .sort((a,b) => a.nome.localeCompare(b.nome,'it'));
  document.getElementById('crediti-rullo').innerHTML = `
    <div class="cr-blocco">
      <div class="cr-titolo">Una giornata<br>all'Acquario</div>
      <div class="cr-occhiello">Guida non ufficiale al visitatore medio</div>
    </div>
    <div class="cr-blocco">
      <div class="cr-occhiello">Con la partecipazione di</div>
      ${persone.map(p => `<p class="cr-nome">${p.emoji||''} ${p.nome}</p>
        <p class="cr-ruolo">${p.latino||''}</p>`).join('')}
    </div>
    <div class="cr-blocco">
      <div class="cr-occhiello">Scritto e programmato da</div>
      <p class="cr-nome">Giovanni Galassi</p>
      <div class="cr-firma">Acquario di Cattolica</div>
    </div>`;
  return persone.length;
}

function apriCrediti(){
  const scr = document.getElementById('crediti-screen');
  const n = costruisciCrediti();
  scr.classList.remove('scorre','statico');
  if(IMPOSTAZIONI.animazioni){
    /* circa 0,8 secondi a nome, più i cartelli di apertura e chiusura */
    const durata = Math.round(10 + n * 0.8);
    scr.classList.add('scorre');
    document.getElementById('crediti-rullo').style.animationDuration = durata + 's';
  } else {
    scr.classList.add('statico');            // animazioni ridotte: lista scorrevole a mano
  }
  scr.classList.add('show');
  scr.scrollTop = 0;
}

function chiudiCrediti(){
  const scr = document.getElementById('crediti-screen');
  scr.classList.remove('show');
  setTimeout(()=>{ scr.classList.remove('scorre','statico'); scr.style.display=''; },
             IMPOSTAZIONI.animazioni ? 600 : 40);
}

/* Service worker: rende il gioco installabile e utilizzabile offline.
   Su file:// i browser lo bloccano, quindi si registra solo via http(s). */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('✅ Modalità offline attiva: il gioco è installabile.');
        reg.update();                       // cerca subito una versione nuova
        /* e ricontrolla ogni volta che torni sull'app dopo averla lasciata */
        document.addEventListener('visibilitychange', () => {
          if(!document.hidden) reg.update();
        });
      })
      .catch(e => console.warn('ℹ️ Service worker non registrato:', e.message));

    /* Quando un service worker nuovo prende il comando, la pagina si ricarica
       una volta sola: così l'aggiornamento si vede subito e non alla riapertura
       successiva. Il controllo su "primoAvvio" evita il ricaricamento infinito
       la primissima volta che il gioco viene installato. */
    let ricaricato = false;
    const primoAvvio = !navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(primoAvvio || ricaricato) return;
      ricaricato = true;
      console.log('↻ Versione nuova trovata: ricarico.');
      location.reload();
    });
  });
} else if(location.protocol === 'file:'){
  console.log('ℹ️ Aperto come file locale: niente installazione né offline. Serve un indirizzo http(s).');
}

document.getElementById('start-crediti').addEventListener('click', ()=>{ feedback(); apriCrediti(); });
document.getElementById('crediti-chiudi').addEventListener('click', e=>{ e.stopPropagation(); feedback(); chiudiCrediti(); });
document.getElementById('crediti-screen').addEventListener('click', chiudiCrediti);
