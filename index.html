<!-- I font non bloccano più il primo disegno: la pagina compare subito con i
     caratteri di sistema e si aggiorna appena arrivano quelli veri. -->

<style>
/* Core variables and theme colors */
:root{
  --abisso:#04121f;
  --profondo:#0a2436;
  --alga:#0e7c86;
  --acqua:#4fd6c9;
  --corallo:#ff8a5b;
  --schiuma:#eaf6f5;
  --energia:#ffd166; 
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
  overscroll-behavior:none;                 /* niente rimbalzo della pagina */
  font-family:'Outfit',sans-serif;color:var(--schiuma)}
#stage{touch-action:pan-y}                  /* si trascina solo in verticale */

#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
/* dvh segue la barra degli indirizzi che compare e scompare sui telefoni */
@supports (height:100dvh){ #stage{height:100dvh} }
/* niente elementi sotto il notch o la barra di stato */
#chapter{ top:calc(22px + env(safe-area-inset-top,0px));
          left:calc(26px + env(safe-area-inset-left,0px)) }
#hud    { top:calc(18px + env(safe-area-inset-top,0px));
          right:calc(22px + env(safe-area-inset-right,0px)) }
#stamina{ top:calc(64px + env(safe-area-inset-top,0px));
          left:calc(26px + env(safe-area-inset-left,0px)) }

#bg{position:absolute;inset:0;background-color:var(--profondo);
  background-size:cover;background-position:center 38%;background-repeat:no-repeat;
  animation:respiro 26s ease-in-out infinite alternate}
@keyframes respiro{from{transform:scale(1)}to{transform:scale(1.055)}}

body.intero #bg{filter:blur(34px) saturate(1.3) brightness(.5);transform:scale(1.15);
  animation:none}

#bg2{display:none;position:absolute;left:0;right:0;top:0;
  height:calc(100% - var(--box-h, 26vh) - 4.5vh);
  background-size:contain;background-position:center;background-repeat:no-repeat;
  animation:respiro 26s ease-in-out infinite alternate}
body.intero #bg2{display:block}

#shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(4,18,31,.28) 0%, rgba(4,18,31,0) 15%,
             rgba(4,18,31,0) 55%, rgba(4,18,31,.10) 75%, rgba(4,18,31,.22) 100%)}
body.intero #shade{
  background:linear-gradient(180deg, rgba(4,18,31,.25) 0%, rgba(4,18,31,0) 14%,
             rgba(4,18,31,0) 62%, rgba(4,18,31,.35) 80%, rgba(4,18,31,.8) 100%)}

@media(prefers-reduced-motion:reduce){#bg,#bg2{animation:none}}

/* Decorative background bubbles */
.bubble{position:absolute;bottom:-40px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.45), rgba(79,214,201,.06));
  border:1px solid rgba(255,255,255,.14);animation:rise linear infinite;pointer-events:none;z-index:2}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.55}100%{transform:translateY(-110vh) translateX(30px);opacity:0}}

/* UI Elements */
#chapter{position:absolute;top:22px;left:26px;z-index:9;
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:var(--acqua);background:rgba(4,18,31,.7);border:1px solid rgba(79,214,201,.45);
  padding:7px 16px;opacity:0;transition:opacity .5s ease .2s}
#chapter.show{opacity:1}

#hud{position:absolute;z-index:15;top:18px;right:22px;
  display:flex;align-items:center;gap:10px;
  background:rgba(4,18,31,.72);border:1px solid rgba(79,214,201,.35);
  border-radius:12px;padding:7px 10px;backdrop-filter:blur(10px);
  opacity:0;transition:opacity .5s ease .3s}
#hud.show{opacity:1}
#inv{display:flex;gap:6px;align-items:center}
#inv:empty::after{content:"zaino vuoto";font-family:'Space Mono',monospace;
  font-size:10px;color:rgba(234,246,245,.35);letter-spacing:1px;padding:0 4px}
.slot{width:34px;height:34px;border-radius:8px;
  background:rgba(79,214,201,.10);border:1px solid rgba(79,214,201,.30);
  display:flex;align-items:center;justify-content:center;
  color:var(--schiuma);position:relative;
  animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.slot svg{width:20px;height:20px;display:block}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.slot::after{content:attr(data-nome);position:absolute;top:calc(100% + 6px);right:0;
  white-space:nowrap;font-family:'Space Mono',monospace;font-size:10px;
  background:rgba(4,18,31,.95);border:1px solid rgba(79,214,201,.4);
  padding:4px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s}
.slot:hover::after{opacity:1}
#euro{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;
  color:var(--acqua);padding-left:10px;border-left:1px solid rgba(79,214,201,.25);
  min-width:78px;text-align:right;transition:color .3s}
#euro.speso{animation:spesa .7s ease}

/* Barra Stamina · pannello autonomo, in alto a sinistra sotto il capitolo */
#stamina{position:absolute;z-index:15;top:64px;left:26px;width:196px;
  --liv:var(--energia);
  background:rgba(4,18,31,.72);border:1px solid rgba(79,214,201,.35);
  border-radius:12px;padding:9px 13px 11px;backdrop-filter:blur(10px);
  opacity:0;transform:translateY(-8px);
  transition:opacity .5s ease .35s, transform .5s ease .35s}
#stamina.show{opacity:1;transform:translateY(0)}
#stamina.bassa  { --liv:#ffa23a }
#stamina.critica{ --liv:var(--corallo) }

.stam-top{display:flex;align-items:baseline;justify-content:space-between;
  gap:8px;margin-bottom:7px}
.stam-lbl{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:2.6px;
  text-transform:uppercase;color:rgba(234,246,245,.48)}
.stam-val{font-family:'Space Mono',monospace;font-weight:700;font-size:16px;
  line-height:1;color:var(--liv);transition:color .35s}
.stam-val::after{content:"⚡";font-size:11px;margin-left:3px;opacity:.75}

.stam-track{height:9px;border-radius:5px;overflow:hidden;
  background:rgba(79,214,201,.10);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.stam-fill{height:100%;width:100%;border-radius:5px;background:var(--liv);
  box-shadow:0 0 12px var(--liv);
  transition:width .55s cubic-bezier(.4,0,.2,1), background .35s, box-shadow .35s}

#stamina.speso .stam-val{animation:battito .65s ease}
#stamina.speso .stam-track{animation:scossa .5s ease}
#stamina.critica .stam-fill{animation:pulsaStam 1.1s ease-in-out infinite}
@keyframes pulsaStam{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes battito{0%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes scossa{0%,100%{transform:translateX(0)}
  25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* Il -15 che vola via quando perdi (o recuperi) energie */
.stam-delta{position:absolute;right:13px;top:4px;pointer-events:none;
  font-family:'Space Mono',monospace;font-weight:700;font-size:13.5px;
  text-shadow:0 2px 6px rgba(4,18,31,.9);
  animation:volaVia 1.15s ease-out forwards}
.stam-delta.giu{color:var(--corallo)}
.stam-delta.su {color:#5ce6a5}
@keyframes volaVia{
  0%{opacity:0;transform:translateY(6px)}
  18%{opacity:1;transform:translateY(-1px)}
  100%{opacity:0;transform:translateY(-26px)}}

/* Main Menu Button within HUD */
#menu-btn { background:none; border:none; color:var(--schiuma); font-size:18px; cursor:pointer; padding:0 0 0 10px; border-left:1px solid rgba(79,214,201,.25); display:flex; align-items:center; transition:transform 0.2s, color 0.2s; }
#menu-btn:hover { transform:scale(1.1); color:var(--acqua); }

@keyframes spesa{0%{color:var(--corallo);transform:scale(1.18)}100%{color:inherit;transform:scale(1)}}

/* Character portrait display - removed delay for instant load */
#char{position:absolute;right:3vw;z-index:12;
  bottom:calc(2vh + var(--box-h, 26vh) - 30px);
  --ritratto:min(30vh,250px);
  opacity:0;transform:translateY(10px);
  transition:opacity .2s ease, transform .2s ease;pointer-events:none}
#char.show{opacity:1;transform:translateY(0)}
#char-img{width:var(--ritratto);height:var(--ritratto);
  border:2px solid var(--acqua);border-radius:12px;overflow:hidden;
  background:linear-gradient(155deg, rgba(14,124,134,.85), rgba(10,36,54,.9));
  box-shadow:0 14px 40px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center}
#char-img img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.emoji-box{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--ritratto) * .48)}

/* Dialogue Box */
#box{position:absolute;left:2vw;right:2vw;bottom:2vh;z-index:10;
  --box-op:.62;
  min-height:15vh;max-height:46vh;overflow:visible;
  background:linear-gradient(180deg,
              rgb(6 24 40 / calc(var(--box-op) * .45)) 0%,
              rgb(5 21 35 / calc(var(--box-op) * .85)) 38%,
              rgb(4 18 31 / calc(var(--box-op) + .18)) 100%);
  border:1px solid rgba(79,214,201,.30);border-radius:16px;
  box-shadow:0 -20px 60px rgba(4,18,31,.35), inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(3px) saturate(1.2);
  padding:18px 26px 16px;
  display:flex;flex-direction:column;justify-content:flex-start}

  /* Dialogue box inner - forced wrap to avoid horizontal scroll */
#box-inner{padding-right:min(21vw,290px);
  max-height:calc(46vh - 36px);overflow-y:auto;overflow-x:hidden !important;
  overscroll-behavior:contain;touch-action:pan-y;
  scrollbar-width:thin;scrollbar-color:rgba(79,214,201,.4) transparent;
  width:100%; overflow-wrap:break-word; word-wrap:break-word;}
#box-inner::-webkit-scrollbar{width:6px}
#box-inner::-webkit-scrollbar-thumb{background:rgba(79,214,201,.4);border-radius:3px}

#plaque{position:absolute;top:0;left:26px;transform:translateY(-100%);
  background:linear-gradient(180deg,rgb(14 44 66 / .93),rgb(8 32 51 / .96));
  backdrop-filter:blur(14px);
  border:2px solid rgba(79,214,201,.55);border-bottom:none;
  border-radius:8px 8px 0 0;padding:7px 18px 8px;
  opacity:0;transition:opacity .4s ease .1s}
#plaque.show{opacity:1}
#plaque .nome{font-family:'Fraunces',serif;font-weight:600;font-size:18px;line-height:1.1}
#plaque .latino{font-family:'Space Mono',monospace;font-size:10.5px;font-style:italic;
  color:var(--corallo);letter-spacing:.5px;margin-top:2px}

#titolo{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(19px,2vw,26px);
  text-shadow:0 2px 6px rgba(0,0,0,.6);
  margin:0 0 10px;opacity:0;transform:translateY(8px);
  transition:opacity .45s ease .2s, transform .45s ease .2s}
#titolo.show{opacity:1;transform:translateY(0)}
#testo{font-size:clamp(14px,1.2vw,16.5px);line-height:1.5;color:rgba(234,246,245,.97);
  text-shadow:0 1px 5px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.6);
  margin:0 0 13px;font-weight:300;opacity:0;transform:translateY(8px);
  transition:opacity .5s ease .35s, transform .5s ease .35s}
#testo.show{opacity:1;transform:translateY(0)}
#stat{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--acqua);
  margin:-10px 0 14px;opacity:0;transition:opacity .5s ease .55s}
#stat.show{opacity:1}

/* Dice Engine Mechanics */
#dadi{margin:0 0 16px;opacity:0;transition:opacity .4s ease .45s}
#dadi.show{opacity:1}
#dadi:empty{display:none}
.dado-riga{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dado{width:clamp(46px,5.5vh,62px);height:clamp(46px,5.5vh,62px);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;font-weight:700;font-size:clamp(22px,2.8vh,30px);
  color:var(--abisso);background:var(--schiuma);border-radius:9px;
  box-shadow:0 6px 16px rgba(0,0,0,.5), inset 0 -3px 0 rgba(0,0,0,.15)}
.dado.tira{animation:scuoti .12s linear infinite}
@keyframes scuoti{0%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-7px) rotate(7deg)}100%{transform:translateY(0) rotate(-6deg)}}
.dado-somma{font-family:'Space Mono',monospace;font-size:15px;color:var(--schiuma)}
.dado-somma b{color:var(--acqua);font-size:21px}
.dado-cond{font-family:'Space Mono',monospace;font-size:12px;color:var(--corallo);
  letter-spacing:1px;text-transform:uppercase;margin-bottom:9px}
.dado-esito{margin-top:11px;font-size:15.5px;line-height:1.5;color:rgba(234,246,245,.9)}
.dado-esito.ok{color:var(--acqua)}

/* Options grid - 100% max width to prevent scroll */
#scelte{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:7px 10px;width:100%;max-width:100%;align-content:start}
.btn{all:unset;cursor:pointer;font-size:14.8px;font-weight:400;color:var(--schiuma);
  text-shadow:0 1px 3px rgba(0,0,0,.8);
  background:rgba(4,18,31,.70);border:1px solid rgba(79,214,201,.32);
  border-left:4px solid var(--acqua);padding:9px 15px;border-radius:5px;
  opacity:0;transform:translateX(-14px);
  transition:opacity .35s ease, transform .35s ease, background .18s, border-color .18s}
.btn.show{opacity:1;transform:translateX(0)}
.btn:hover,.btn:focus-visible{background:rgba(11,58,72,.82);border-left-color:var(--corallo);outline:none}
.btn:focus-visible{box-shadow:0 0 0 2px var(--acqua)}
.btn .num{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--acqua);margin-right:11px}
.btn.avanti{grid-column:1/-1;border-left-color:var(--corallo);max-width:100%;text-align:center}
.btn.uscita{grid-column:1/-1;border-left-color:var(--corallo);background:rgba(38,20,14,.72);margin-top:4px}
.btn.fatto{opacity:.45;border-left-color:rgba(234,246,245,.3)}
.btn.fatto.show{opacity:.45}
/* Una voce già fatta è chiusa: niente cursore a manina, niente reazione
   al passaggio del dito, e il click viene ignorato anche dal codice. */
.btn.fatto{cursor:default;pointer-events:none}
.btn.fatto:hover{transform:none;background:rgba(4,18,31,.55);border-color:rgba(79,214,201,.25)}

#esito{display:inline-block;align-self:flex-start;font-family:'Space Mono',monospace;
  font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;
  padding:5px 12px;margin-bottom:10px;border:1px solid currentColor;
  opacity:0;transition:opacity .4s ease .15s}
#esito.show{opacity:1}
#esito.good{color:var(--acqua)}
#esito.bad{color:var(--corallo)}
#esito:empty{display:none}

/* Water wave transition effect */
#wave-wrap{position:fixed;inset:0;z-index:40;pointer-events:none;
  transform:translateY(calc(100% + 90px));transition:transform .7s cubic-bezier(.66,0,.34,1)}
#wave-wrap.up{transform:translateY(0)}
#wave-wrap svg{position:absolute;top:0;left:0;width:100%;height:90px;transform:translateY(-88px)}
#wave-body{position:absolute;inset:0;background:linear-gradient(180deg,var(--alga) 0%, var(--profondo) 70%)}
@media(prefers-reduced-motion:reduce){
  #wave-wrap{transition:opacity .3s ease;transform:none;opacity:0}
  #wave-wrap.up{opacity:1}
  .bubble{display:none}
}

/* Splash screen */
#title-screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:0 26px;
  background:radial-gradient(ellipse at 50% 40%, #0d3a4d 0%, var(--abisso) 72%)}
#title-screen h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(32px,5.2vw,60px);margin:0 0 8px;line-height:1.05}
#title-screen .sub{font-family:'Space Mono',monospace;color:var(--acqua);letter-spacing:3px;
  text-transform:uppercase;font-size:12px;margin:0 0 36px}
#start{all:unset;cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;font-size:13px;color:var(--abisso);background:var(--acqua);
  padding:16px 42px;box-shadow:0 10px 34px rgba(79,214,201,.3);transition:transform .2s}
#start:hover{transform:translateY(-2px)}

/* Riprendi: compare solo se c'è una partita lasciata a metà */
#riprendi{all:unset;display:none;cursor:pointer;font-family:'Space Mono',monospace;
  font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:13px;
  color:var(--acqua);background:rgba(79,214,201,.10);
  border:1px solid var(--acqua);padding:16px 34px;transition:all .2s}
#riprendi:hover{transform:translateY(-2px);background:rgba(79,214,201,.22)}
#riprendi.c-e{display:inline-block}
#riprendi-info{display:none;font-family:'Space Mono',monospace;font-size:10.5px;
  letter-spacing:1.2px;color:rgba(234,246,245,.45);margin-top:14px;line-height:1.6}
#riprendi-info.c-e{display:block}

/* Riga di pulsanti sotto il titolo */
/* "Entra" resta l'unico pulsante pieno. Impostazioni e Crediti stanno
   sotto, sulla stessa riga, come due voci di testo discrete. */
#title-azioni{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
#title-secondari{display:flex;align-items:center;justify-content:center;
  gap:16px;margin-top:26px;flex-wrap:wrap;max-width:100%}
#title-secondari .sep{font-family:'Space Mono',monospace;font-size:11px;
  color:rgba(234,246,245,.20);user-select:none}

/* Telefoni: il titolo si stringe, le tre voci vanno a capo se non ci stanno */
@media(max-width:620px){
  #title-screen{padding:0 18px;
    padding-top:calc(env(safe-area-inset-top,0px));
    padding-bottom:calc(env(safe-area-inset-bottom,0px))}
  #title-screen h1{font-size:clamp(30px,8.5vw,46px)}
  #title-screen .sub{font-size:11px;letter-spacing:2px;margin:0 0 30px}
  #start{padding:17px 46px;font-size:13.5px}
  #title-secondari{gap:10px 14px;margin-top:24px}
  #start-opts, #start-crediti, #start-collezione{font-size:10.5px;letter-spacing:1.4px}
}
@media(max-width:400px){
  /* sotto i 400px le tre voci non stanno su una riga: vanno in colonna
     e i puntini di separazione spariscono */
  #title-secondari{flex-direction:column;gap:14px}
  #title-secondari .sep{display:none}
  #start-opts, #start-crediti, #start-collezione{font-size:11.5px;padding-bottom:4px}
}
@media(orientation:landscape) and (max-height:520px){
  #title-screen h1{font-size:clamp(24px,5.5vh,38px);margin:0 0 4px}
  #title-screen .sub{font-size:10px;margin:0 0 16px}
  #start{padding:12px 38px}
  #title-secondari{margin-top:14px}
  #credits{bottom:8px;right:12px}
}

/* ── Galleria dei finali e trofei ── */
.fin-item, .trofeo{display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.05);padding:12px 11px;border-radius:8px;
  border:1px solid transparent;margin-bottom:8px;transition:all .25s}
.fin-item.visto{border-color:var(--acqua);background:rgba(79,214,201,.06)}
.fin-item.apribile{cursor:pointer}
.fin-item.apribile:hover{background:rgba(79,214,201,.14)}
.trofeo.preso{border-color:var(--energia);background:rgba(255,209,102,.07)}
.trofeo.platino{border-style:dashed}
.trofeo.platino.preso{border-style:solid;border-color:#b9c7d6;
  background:linear-gradient(120deg, rgba(185,199,214,.18), rgba(255,209,102,.10));
  box-shadow:0 0 18px rgba(185,199,214,.25)}
.trofeo.platino.preso .tr-nome{color:#e6eef7}
.fin-ico, .tr-ico{font-size:23px;line-height:1;width:30px;text-align:center;flex-shrink:0}
.fin-info, .tr-info{display:flex;flex-direction:column;min-width:0}
.fin-nome, .tr-nome{font-family:'Fraunces',serif;font-size:15.5px;color:var(--schiuma);
  line-height:1.25}
.fin-lab, .tr-desc{font-family:'Space Mono',monospace;font-size:10.5px;
  line-height:1.45;margin-top:3px;color:rgba(234,246,245,.45)}
.fin-lab.buono{color:var(--acqua)}
.fin-lab.cattivo{color:var(--corallo)}
.fin-item:not(.visto) .fin-nome, .trofeo:not(.preso) .tr-nome{color:rgba(234,246,245,.35)}

/* ── Foto del personaggio: si apre toccandone il nome ── */
.char-item.apribile{cursor:pointer}
.char-item.apribile:hover{background:rgba(79,214,201,.14)}
#char-foto{position:fixed;inset:0;z-index:140;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(4,18,31,.92);backdrop-filter:blur(10px);
  opacity:0;transition:opacity .3s ease}
#char-foto.show{display:flex;opacity:1}
#cf-riquadro{width:min(340px,100%);text-align:center;
  background:linear-gradient(160deg, rgba(13,58,77,.96), rgba(4,18,31,.98));
  border:1px solid rgba(79,214,201,.42);border-radius:18px;
  padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  transform:scale(.94);transition:transform .3s ease}
#char-foto.show #cf-riquadro{transform:scale(1)}
#cf-img{width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
  background:rgba(79,214,201,.10);border:1px solid rgba(79,214,201,.25);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px}
#cf-img img{width:100%;height:100%;object-fit:cover;display:block}
#cf-img .cf-emoji{font-size:78px;line-height:1}
#cf-nome{font-family:'Fraunces',serif;font-weight:900;font-size:23px;color:var(--schiuma)}
#cf-latino{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:1.4px;
  color:var(--corallo);margin-top:5px;font-style:italic}
#cf-nota{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:1.2px;
  color:rgba(234,246,245,.35);margin-top:14px}
#cf-chiudi{all:unset;display:block;width:100%;box-sizing:border-box;margin-top:16px;
  cursor:pointer;text-align:center;font-family:'Space Mono',monospace;font-weight:700;
  font-size:12px;letter-spacing:2px;text-transform:uppercase;
  color:var(--abisso);background:var(--acqua);border-radius:10px;padding:14px 10px}

/* ── Novità: si apre una volta sola dopo un aggiornamento ── */
#novita{position:fixed;inset:0;z-index:130;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(4,18,31,.88);backdrop-filter:blur(8px);
  opacity:0;transition:opacity .45s ease}
#novita.show{display:flex;opacity:1}
#novita-riquadro{width:min(460px,100%);max-height:82vh;overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y;
  background:linear-gradient(160deg, rgba(13,58,77,.96), rgba(4,18,31,.98));
  border:1px solid rgba(79,214,201,.42);border-radius:18px;
  padding:26px 24px 22px;box-shadow:0 24px 60px rgba(0,0,0,.6);
  transform:translateY(14px);transition:transform .45s ease}
#novita.show #novita-riquadro{transform:translateY(0)}
.nov-occhiello{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2.8px;
  text-transform:uppercase;color:var(--acqua);margin-bottom:8px}
.nov-titolo{font-family:'Fraunces',serif;font-weight:900;font-size:25px;
  color:var(--schiuma);line-height:1.15;margin:0 0 18px}
.nov-voce{display:flex;gap:12px;align-items:flex-start;
  padding:12px 0;border-bottom:1px solid rgba(79,214,201,.14)}
.nov-voce:last-of-type{border-bottom:none}
.nov-ico{font-size:19px;line-height:1.2;flex-shrink:0;width:24px;text-align:center}
.nov-testo b{display:block;font-size:15px;color:var(--schiuma);margin-bottom:3px;font-weight:600}
.nov-testo span{font-size:13.5px;line-height:1.5;color:rgba(234,246,245,.65)}
/* Sezione Ricercati, in fondo alla bacheca */
#nov-ricercati:not(:empty){margin-top:20px;padding-top:16px;
  border-top:1px dashed rgba(255,138,91,.35)}
.ric-testa{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2.8px;
  text-transform:uppercase;color:var(--corallo)}
.ric-nota{font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.5;
  color:rgba(234,246,245,.42);margin:6px 0 12px}
.ric-voce{display:flex;align-items:center;gap:12px;padding:9px 0;
  border-bottom:1px solid rgba(255,138,91,.12)}
.ric-voce:last-child{border-bottom:none}
.ric-ombra{width:38px;height:38px;flex-shrink:0;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Mono',monospace;font-weight:700;font-size:18px;
  color:rgba(255,138,91,.75);background:rgba(255,138,91,.10);
  border:1px dashed rgba(255,138,91,.4)}
.ric-info b{display:block;font-family:'Fraunces',serif;font-weight:600;
  font-size:15px;color:var(--schiuma)}
.ric-info span{font-family:'Space Mono',monospace;font-size:10.5px;
  color:rgba(234,246,245,.45)}

#novita-ok{all:unset;display:block;width:100%;box-sizing:border-box;margin-top:20px;
  cursor:pointer;text-align:center;font-family:'Space Mono',monospace;font-weight:700;
  font-size:13px;letter-spacing:2px;text-transform:uppercase;
  color:var(--abisso);background:var(--acqua);border-radius:10px;padding:15px 10px;
  transition:transform .2s}
#novita-ok:hover{transform:translateY(-2px)}
/* "Novità" è il pulsante principale del piede delle Impostazioni:
   pieno e turchese, mentre il ripristino resta discreto e in corallo. */
#opt-novita{all:unset;cursor:pointer;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:'Space Mono',monospace;font-weight:700;font-size:12.5px;
  letter-spacing:1.6px;text-transform:uppercase;
  color:var(--abisso);background:var(--acqua);border-radius:10px;
  padding:14px 22px;box-shadow:0 8px 22px rgba(79,214,201,.28);
  transition:transform .2s, box-shadow .2s}
#opt-novita:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(79,214,201,.42)}
#opt-novita .on-ico{font-size:15px}
#opt-novita.nuova{animation:pulsaNovita 1.9s ease-in-out infinite}
@keyframes pulsaNovita{0%,100%{box-shadow:0 8px 22px rgba(79,214,201,.28)}
  50%{box-shadow:0 8px 30px rgba(79,214,201,.65)}}

/* ── Premessa: schermata nera prima della prima scena ── */
#premessa{position:fixed;inset:0;z-index:110;display:none;
  align-items:center;justify-content:center;background:#000;
  padding:34px 26px;cursor:pointer;opacity:0;transition:opacity .8s ease}
#premessa.show{display:flex;opacity:1}
#premessa .testo{max-width:640px;text-align:center;
  font-family:'Fraunces',serif;font-size:clamp(16px,2.15vh,21px);
  line-height:1.75;color:rgba(234,246,245,.88);
  opacity:0;transition:opacity 1.6s ease}
#premessa .testo.on{opacity:1}
#premessa .coda{display:block;margin-top:34px;
  font-size:clamp(18px,2.5vh,25px);font-weight:900;color:var(--schiuma);
  opacity:0;transition:opacity 1.4s ease}
#premessa .coda.on{opacity:1}
/* Uscita in tre tempi: prima svaniscono le parole, poi si scopre la
   scena sotto, infine si alza il nero. Più dolce dello stacco secco. */
#premessa.uscita .testo,
#premessa.uscita .coda,
#premessa.uscita .salta{transition:opacity .5s ease;opacity:0}
#premessa.uscita{transition:opacity 1.1s ease}
#premessa .salta{position:absolute;right:20px;bottom:18px;
  font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:2px;
  text-transform:uppercase;color:rgba(234,246,245,.22);
  opacity:0;transition:opacity 1s ease 2.5s}
#premessa.show .salta{opacity:1}

/* ── Titoli di coda, a richiesta ── */
#crediti-screen{position:fixed;inset:0;z-index:120;display:none;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%, #0d3a4d 0%, var(--abisso) 78%);
  opacity:0;transition:opacity .6s ease}
#crediti-screen.show{display:block;opacity:1}
#crediti-rullo{position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:min(560px,88vw);text-align:center;padding:0 0 40vh}
#crediti-screen.scorre #crediti-rullo{animation:rullo linear forwards}
#crediti-screen.statico{overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
#crediti-screen.statico #crediti-rullo{position:relative;left:auto;transform:none;
  margin:0 auto;padding:60px 0 60px}
@keyframes rullo{from{top:100vh}to{top:calc(-100% - 10vh)}}

.cr-blocco{margin:0 0 54px}
.cr-titolo{font-family:'Fraunces',serif;font-weight:900;
  font-size:clamp(26px,4.4vw,44px);line-height:1.1;color:var(--schiuma);margin:0 0 10px}
.cr-occhiello{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3.4px;
  text-transform:uppercase;color:var(--acqua);margin:0 0 22px}
.cr-nome{font-family:'Fraunces',serif;font-size:19px;color:var(--schiuma);
  line-height:1.25;margin:0}
.cr-ruolo{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:1.4px;
  color:rgba(234,246,245,.42);margin:2px 0 18px}
.cr-firma{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:2.6px;
  color:var(--acqua);margin-top:10px}

/* Sta sopra a tutto e sotto al notch: senza il safe-area finiva
   sull'orologio dell'iPhone e diventava intoccabile. */
#crediti-chiudi{all:unset;position:fixed;z-index:5;
  right:calc(16px + env(safe-area-inset-right,0px));
  top:calc(14px + env(safe-area-inset-top,0px));
  cursor:pointer;font-family:'Space Mono',monospace;font-size:11px;
  letter-spacing:2px;text-transform:uppercase;color:rgba(234,246,245,.62);
  padding:12px 18px;border:1px solid rgba(79,214,201,.35);border-radius:8px;
  background:rgba(4,18,31,.85);backdrop-filter:blur(8px);
  transition:all .2s}
#crediti-chiudi:hover{color:var(--acqua);border-color:var(--acqua)}
@media(max-width:520px){
  #crediti-chiudi{padding:13px 16px;font-size:10.5px;
    right:calc(12px + env(safe-area-inset-right,0px));
    top:calc(12px + env(safe-area-inset-top,0px))}
}

#start-crediti, #start-opts, #start-collezione{all:unset;cursor:pointer;font-family:'Space Mono',monospace;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(234,246,245,.45);
  border-bottom:1px solid rgba(234,246,245,.18);padding-bottom:3px;transition:all .2s}
#start-crediti:hover, #start-opts:hover, #start-collezione:hover{color:var(--acqua);border-color:var(--acqua)}

/* Firma */
#credits{position:absolute;right:22px;bottom:18px;
  font-family:'Space Mono',monospace;font-size:11px;letter-spacing:1.6px;
  color:rgba(234,246,245,.32);pointer-events:none;user-select:none}
@media(max-width:520px){ #credits{right:14px;bottom:12px;font-size:10px} }

/* Dal titolo si apre solo la scheda Impostazioni */
#game-modal.solo-opzioni #modal-nav button[data-tab]:not([data-tab="tab-opts"]){display:none}
#game-modal.solo-collezione #modal-nav button[data-tab]:not([data-tab="tab-chars"]):not([data-tab="tab-finali"]):not([data-tab="tab-trofei"]){display:none}
#game-modal.solo-opzioni #btn-home,
#game-modal.solo-collezione #btn-home{display:none}

/* Global Options Modal UI */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(4,18,31,0.85); z-index:100; backdrop-filter:blur(8px); align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-content { background:linear-gradient(180deg, var(--profondo) 0%, var(--abisso) 100%); border:1px solid var(--acqua); border-radius:16px; padding:20px 20px 30px; width:90%; max-width:600px; max-height:85vh; display:flex; flex-direction:column; position:relative; box-shadow:0 10px 40px rgba(0,0,0,0.8); }
#modal-close { position:absolute; top:15px; right:15px; background:none; border:none; color:var(--corallo); font-size:24px; cursor:pointer; line-height:1; }
.modal-header { font-family:'Fraunces', serif; font-size:20px; color:var(--acqua); margin:0 0 15px; }
#modal-nav { display:flex; flex-wrap:wrap; gap:8px; border-bottom:1px solid rgba(79,214,201,.3); padding-bottom:10px; margin-bottom:15px; flex-wrap:wrap; }
#modal-nav button { background:none; border:1px solid transparent; color:var(--schiuma); padding:6px 12px; cursor:pointer; font-family:'Space Mono', monospace; font-size:12px; transition:all 0.2s; border-radius:4px; }
#modal-nav button:hover, #modal-nav button.active { border-color:var(--acqua); background:rgba(79,214,201,.1); }
#btn-home { color:var(--corallo) !important; margin-left:auto; border-color:var(--corallo) !important; }
#btn-home:hover { background:rgba(255,138,91,.1) !important; }

.tab-body { display:none; flex-grow:1; overflow-y:auto; overflow-x:hidden; touch-action:pan-y; padding-right:10px; scrollbar-width:thin; scrollbar-color:rgba(79,214,201,.4) transparent; }
.tab-body.active { display:block; }
.tab-body::-webkit-scrollbar { width:6px; }
.tab-body::-webkit-scrollbar-thumb { background:rgba(79,214,201,.4); border-radius:3px; }

/* Tab Impostazioni */
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:13px 2px;border-bottom:1px solid rgba(79,214,201,.14)}
.opt-row:last-child{border-bottom:none}
.opt-label{font-size:14.5px;color:var(--schiuma)}
.opt-desc{font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.45;
  color:rgba(234,246,245,.42);margin-top:4px;max-width:34ch}
.opt-ctrl{display:flex;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.opt-ctrl button{background:none;border:1px solid rgba(79,214,201,.25);border-radius:5px;
  color:rgba(234,246,245,.6);padding:6px 11px;cursor:pointer;
  font-family:'Space Mono',monospace;font-size:11px;transition:all .18s}
.opt-ctrl button:hover{border-color:var(--acqua);color:var(--schiuma)}
.opt-ctrl button.on{border-color:var(--acqua);background:rgba(79,214,201,.18);
  color:var(--acqua);font-weight:700}
.opt-nota{font-family:'Space Mono',monospace;font-size:10.5px;
  color:rgba(234,246,245,.35);padding:14px 2px 0;line-height:1.6}
@media(max-width:520px){
  .opt-row{flex-direction:column;align-items:flex-start;gap:10px}
  .opt-ctrl{justify-content:flex-start}
  .opt-desc{max-width:none}
}

/* Animazioni ridotte */
body.no-anim .bubble{display:none}
body.no-anim *,body.no-anim *::before,body.no-anim *::after{
  animation-duration:.001s!important;animation-iteration-count:1!important;
  transition-duration:.001s!important;transition-delay:0s!important}

/* Map Tab Elements */
#map-wrapper { width:100%; display:flex; justify-content:center; }
#map-img { max-width:100%; height:auto; border-radius:8px; border:1px solid rgba(255,255,255,0.1); }
.map-error { color:var(--corallo); font-family:'Space Mono', monospace; text-align:center; padding:40px 20px; border:1px dashed var(--corallo); border-radius:8px; }

/* Collectible Stamps Tab Elements */
.stamp-grid { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; padding-top:10px; }
.stamp-item { display:flex; flex-direction:column; align-items:center; opacity:0.8; transition:all 0.3s; width:110px; text-align:center; }
.stamp-item svg { width:50px; height:50px; color:var(--acqua); margin-bottom:10px; }
.stamp-item.locked svg { color: rgba(255,255,255,0.2); }
.stamp-item span { font-size:11px; font-family:'Space Mono', monospace; color:var(--schiuma); line-height: 1.2;}

/* Encountered Characters Tab Elements */
.char-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
.char-item { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; border:1px solid transparent; transition:all 0.3s;}
.char-item.met { border-color:var(--acqua); background:rgba(79,214,201,.05); }
.char-icon { font-size:24px; filter:grayscale(100%); opacity:0.3; width:30px; text-align:center; }
.char-item.met .char-icon { filter:none; opacity:1; }
.char-info { display:flex; flex-direction:column; }
.char-name { font-weight:600; font-size:14px; color:rgba(234,246,245,.5); }
.char-item.met .char-name { color:var(--schiuma); }
.char-latin { font-family:'Space Mono', monospace; font-size:9.5px; color:var(--corallo); opacity:0; }
.char-item.met .char-latin { opacity:0.8; }

@media(max-width:900px){
  #box{left:3vw;right:3vw;bottom:2vh;padding:22px 20px 20px;min-height:36vh}
  #box-inner{padding-right:34vw}
  #char{height:52vh;right:0}

/* ══════════════════════════════════════════════════════════════
   ZAINO A SCOMPARSA
   Su desktop restano le icone in fila dentro l'HUD. Su schermi
   piccoli le icone spariscono e resta un solo tasto 🎒 con il
   numero di oggetti, che apre questo pannello.
   ══════════════════════════════════════════════════════════════ */
#zaino-btn{display:none;align-items:center;gap:5px;
  background:rgba(79,214,201,.10);border:1px solid rgba(79,214,201,.30);
  border-radius:9px;padding:5px 9px;cursor:pointer;color:var(--schiuma);
  font-family:'Space Mono',monospace;font-size:13px;line-height:1;
  transition:background .2s,border-color .2s}
#zaino-btn.aperto{background:rgba(79,214,201,.25);border-color:var(--acqua)}
#zaino-btn .zb-ico{font-size:15px}
#zaino-btn .zb-n{font-weight:700;color:var(--acqua);min-width:9px;text-align:center}
#zaino-btn.vuoto .zb-n{color:rgba(234,246,245,.35)}

#zaino-panel{position:absolute;z-index:16;display:none;
  top:calc(64px + env(safe-area-inset-top,0px));
  right:calc(12px + env(safe-area-inset-right,0px));
  width:min(280px,84vw);max-height:52vh;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;touch-action:pan-y;
  background:rgba(4,18,31,.95);border:1px solid rgba(79,214,201,.40);
  border-radius:14px;padding:12px 14px;backdrop-filter:blur(12px);
  box-shadow:0 18px 45px rgba(0,0,0,.55);
  opacity:0;transform:translateY(-8px);
  transition:opacity .22s ease, transform .22s ease}
#zaino-panel.show{display:block;opacity:1;transform:translateY(0)}
.zp-titolo{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:2.6px;
  text-transform:uppercase;color:var(--acqua);
  padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid rgba(79,214,201,.22)}
.zp-riga{display:flex;align-items:center;gap:11px;padding:8px 2px;
  border-bottom:1px solid rgba(79,214,201,.10)}
.zp-riga:last-child{border-bottom:none}
.zp-riga svg{width:19px;height:19px;flex-shrink:0;color:var(--acqua)}
.zp-riga span{font-size:14px;line-height:1.3;color:rgba(234,246,245,.92)}
.zp-vuoto{font-family:'Space Mono',monospace;font-size:12px;font-style:italic;
  color:rgba(234,246,245,.38);padding:6px 2px}

/* ══════════════════════════════════════════════════════════════
   TELEFONI · una sola fascia in alto, niente sovrapposizioni
   ══════════════════════════════════════════════════════════════ */
@media(max-width:820px), (orientation:landscape) and (max-height:520px){
  /* Prima riga: SOLO l'HUD, tutto a destra. Così può allargarsi quanto
     vuole al variare del font senza andare a sbattere contro nulla. */
  #hud{top:calc(8px + env(safe-area-inset-top,0px));
    right:calc(10px + env(safe-area-inset-right,0px));
    max-width:calc(100vw - 20px);
    gap:6px;padding:5px 7px;border-radius:10px}
  #inv{display:none}                    /* via le icone in fila */
  #zaino-btn{display:flex;padding:4px 8px;font-size:12.5px}
  #zaino-btn .zb-ico{font-size:14px}
  #euro{font-size:12.5px;min-width:0;padding-left:7px}
  #menu-btn{font-size:15px;padding-left:7px}
  .mb-testo{display:none}

  /* Seconda riga: capitolo a sinistra e stamina a destra, con lo spazio
     diviso a priori. Nessuno dei due può invadere l'altro. */
  #chapter{max-width:none;width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    top:calc(16px + env(safe-area-inset-top,0px) + var(--hud-h, 36px));
    left:calc(10px + env(safe-area-inset-left,0px));
    font-size:9px;letter-spacing:1.4px;padding:8px 10px;border-radius:10px;
    display:flex;align-items:center}
  #stamina{top:calc(16px + env(safe-area-inset-top,0px) + var(--hud-h, 36px));
    left:calc(38vw + 18px + env(safe-area-inset-left,0px));
    right:calc(10px + env(safe-area-inset-right,0px));
    width:auto;padding:6px 11px 7px;border-radius:10px}
  .stam-top{margin-bottom:4px}
  .stam-lbl{display:none}              /* il posto lo prende il capitolo */
  .stam-val{font-size:13px}
  .stam-track{height:7px}
  #stamina .stam-top{justify-content:flex-end}
  #zaino-panel{top:calc(58px + env(safe-area-inset-top,0px) + var(--hud-h, 36px))}

  /* Fixed box layout for mobile devices */
  #box{left:8px;right:8px;bottom:8px;padding:14px 16px 12px;
    height:45vh;min-height:45vh;max-height:45vh;border-radius:14px;overflow:hidden;}
  #box-inner{padding-right:0;height:100%;max-height:100%;overflow-x:hidden;}
  #titolo{font-size:19px;margin-bottom:8px}
  #testo{font-size:15.5px;line-height:1.52}
  #plaque{left:14px;padding:5px 12px 6px}
  #plaque .nome{font-size:15px}
  #plaque .latino{font-size:9.5px}

  /* Fixed character position */
  #char{right:8px;bottom:calc(45vh + 16px);height:auto;top:auto;}
  #char-img{width:min(19vh,120px);height:min(19vh,120px);border-radius:10px}
  #char-img img{max-width:none}
  .emoji-box{width:100%;height:100%;font-size:min(9vh,58px);margin:0}

  /* pulsanti e dadi grandi abbastanza da centrarli col pollice */
  .btn{font-size:15px;padding:12px 14px;min-height:46px}
  .dado{width:clamp(42px,11vw,54px);height:clamp(42px,11vw,54px);font-size:22px}
  .dado-riga{gap:10px}
}

/* Telefono in verticale stretto */
@media(max-width:430px){
  #chapter{max-width:38vw;font-size:9px;letter-spacing:1.2px}
  #euro{font-size:12.5px}
  /* Strict box size */
  #box{height:45vh;min-height:45vh;max-height:45vh;}
  #box-inner{height:100%;max-height:100%;}
  #char-img{width:min(15vh,96px);height:min(15vh,96px)}
  /* Fixed character position */
  #char{bottom:calc(45vh + 16px);}
  #titolo{font-size:17.5px}
  #testo{font-size:15px}
}

/* Telefono in orizzontale: poca altezza, molta larghezza */
@media(orientation:landscape) and (max-height:520px){
  #chapter{width:auto;max-width:24vw;font-size:9px;padding:4px 9px;
    top:calc(6px + env(safe-area-inset-top,0px));
    left:calc(10px + env(safe-area-inset-left,0px))}
  #hud{top:calc(5px + env(safe-area-inset-top,0px));padding:4px 7px;gap:6px}
  /* qui la stamina non può stare su una riga sua: entra nell'HUD */
  #stamina{position:absolute;top:calc(5px + env(safe-area-inset-top,0px));
    left:auto;right:calc(var(--hud-w, 180px) + 18px + env(safe-area-inset-right,0px));
    width:120px;padding:5px 9px 6px;border-radius:9px}
  .stam-top{margin-bottom:3px}
  .stam-lbl{display:none}
  .stam-val{font-size:12px}
  .stam-track{height:6px}
  #zaino-panel{top:calc(14px + env(safe-area-inset-top,0px) + var(--hud-h, 34px));max-height:64vh}

  #box{left:8px;right:8px;bottom:6px;min-height:0;max-height:74vh;padding:12px 16px 10px}
  #box-inner{max-height:calc(74vh - 26px);padding-right:min(22vw,190px)}
  #titolo{font-size:17px;margin-bottom:6px}
  #testo{font-size:14.5px;line-height:1.45;margin-bottom:10px}
  #char{right:calc(10px + env(safe-area-inset-right,0px));
    bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto}
  #char-img{width:min(42vh,160px);height:min(42vh,160px)}
  .btn{min-height:40px;padding:9px 13px;font-size:14px}
  .dado{width:44px;height:44px;font-size:20px}
  #dadi{margin-bottom:10px}
}

/* ══════════════════════════════════════════════════════════
   SCHERMATA DI FINE · si apre sopra tutto quando arrivi a un finale
   L'immagine di sfondo cambia in base al finale: vedi il campo
   "immagineFine" sulle scene con finale:"good"/"bad".
   ══════════════════════════════════════════════════════════ */
#fine-screen{position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;
  background:#04121f;opacity:0;transition:opacity 1.1s ease}
#fine-screen.show{opacity:1}
#fine-img{position:absolute;inset:0;background-size:cover;background-position:center;
  transform:scale(1.07);transition:transform 11s linear}
#fine-screen.show #fine-img{transform:scale(1)}
#fine-velo{position:absolute;inset:0;
  background:radial-gradient(ellipse at center, rgba(4,18,31,.30) 0%, rgba(4,18,31,.86) 68%, rgba(4,18,31,.97) 100%)}

#fine-centro{position:relative;z-index:2;text-align:center;padding:30px 24px;
  max-width:640px;width:100%}
#fine-parola{font-family:'Fraunces',serif;font-weight:900;
  font-size:clamp(56px,13vh,124px);line-height:1;letter-spacing:.16em;text-indent:.16em;
  color:var(--schiuma);text-shadow:0 6px 44px rgba(4,18,31,.95);
  opacity:0;transform:translateY(16px);
  transition:opacity 1.4s ease .5s, transform 1.4s ease .5s}
#fine-screen.show #fine-parola{opacity:1;transform:translateY(0)}
#fine-riga{width:0;height:1px;margin:22px auto 18px;background:var(--acqua);
  box-shadow:0 0 12px var(--acqua);transition:width 1.3s ease 1.1s}
#fine-screen.show #fine-riga{width:180px}
#fine-label{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:3px;
  text-transform:uppercase;opacity:0;transition:opacity 1.1s ease 1.5s}
#fine-screen.show #fine-label{opacity:1}
#fine-label.good{color:var(--acqua)}
#fine-label.bad{color:var(--corallo)}
#fine-titolo{font-family:'Fraunces',serif;font-size:clamp(18px,2.6vh,25px);
  color:rgba(234,246,245,.80);margin-top:10px;
  opacity:0;transition:opacity 1.1s ease 1.7s}
#fine-screen.show #fine-titolo{opacity:1}

#fine-azioni{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:36px;
  opacity:0;transform:translateY(10px);
  transition:opacity 1s ease 2.1s, transform 1s ease 2.1s}
#fine-screen.show #fine-azioni{opacity:1;transform:translateY(0)}
#fine-azioni button{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:1px;
  padding:13px 22px;border-radius:9px;cursor:pointer;
  background:rgba(4,18,31,.7);color:var(--schiuma);
  border:1px solid rgba(79,214,201,.45);backdrop-filter:blur(8px);
  transition:all .22s ease}
#fine-azioni button:hover{background:rgba(79,214,201,.18);border-color:var(--acqua);
  color:var(--acqua);transform:translateY(-2px)}

/* Pannello riepilogo, sopra la stessa immagine */
#fine-riepilogo{position:absolute;inset:0;z-index:3;display:none;
  overflow-y:auto;overflow-x:hidden;touch-action:pan-y;padding:36px 22px 30px;
  background:rgba(4,18,31,.94);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .45s ease}
#fine-riepilogo.show{display:block;opacity:1}
.riep-wrap{max-width:660px;margin:0 auto}
.riep-titolo{font-family:'Fraunces',serif;font-weight:900;font-size:26px;
  color:var(--schiuma);text-align:center;margin:0 0 5px}
.riep-sub{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:rgba(234,246,245,.42);text-align:center;margin-bottom:26px}

.riep-cifre{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));
  gap:10px;margin-bottom:26px}
.riep-cifra{background:rgba(79,214,201,.07);border:1px solid rgba(79,214,201,.22);
  border-radius:10px;padding:13px 12px;text-align:center}
.riep-cifra .v{font-family:'Space Mono',monospace;font-weight:700;font-size:21px;
  color:var(--acqua);line-height:1.1}
.riep-cifra .k{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:1.6px;
  text-transform:uppercase;color:rgba(234,246,245,.45);margin-top:6px}

.riep-sez{margin-bottom:24px}
.riep-sez h4{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:2.4px;
  text-transform:uppercase;color:var(--acqua);margin:0 0 11px;
  padding-bottom:7px;border-bottom:1px solid rgba(79,214,201,.2)}
.riep-chip{display:inline-flex;align-items:center;gap:6px;
  font-family:'Space Mono',monospace;font-size:12px;
  background:rgba(79,214,201,.10);border:1px solid rgba(79,214,201,.28);
  border-radius:20px;padding:6px 13px;margin:0 6px 7px 0;color:var(--schiuma)}
.riep-chip svg{width:14px;height:14px;color:var(--acqua);flex-shrink:0}
.riep-chip.no{background:rgba(255,255,255,.03);border-color:rgba(234,246,245,.12);
  color:rgba(234,246,245,.30)}
.riep-chip.no svg{color:rgba(234,246,245,.25)}
.riep-vuoto{font-family:'Space Mono',monospace;font-size:12px;
  color:rgba(234,246,245,.35);font-style:italic}

@media(max-width:520px){
  #fine-parola{font-size:clamp(44px,11vh,80px)}
  #fine-azioni{flex-direction:column;align-items:center}
  #fine-azioni button{width:100%;max-width:290px}
  .riep-cifre{grid-template-columns:repeat(2,1fr)}
}

/* ── Impostazioni: pulsanti grandi abbastanza per il pollice ── */
.opt-azioni{display:flex;flex-direction:column;gap:10px;
  padding:18px 2px 2px;align-items:stretch}
#opt-reset{all:unset;cursor:pointer;box-sizing:border-box;text-align:center;
  font-family:'Space Mono',monospace;font-size:11px;
  letter-spacing:1.4px;text-transform:uppercase;color:var(--corallo);
  border:1px solid rgba(255,138,91,.35);border-radius:8px;padding:11px 18px;
  display:block;transition:all .2s}
#opt-reset:hover{background:rgba(255,138,91,.12);border-color:var(--corallo)}

/* ── Collezione personaggi ── */
.char-conta{font-family:'Space Mono',monospace;font-size:10.5px;line-height:1.6;
  letter-spacing:1.2px;color:var(--acqua);
  padding:0 2px 12px;margin-bottom:12px;border-bottom:1px solid rgba(79,214,201,.2)}
.char-item.oggi{border-color:rgba(79,214,201,.55);background:rgba(79,214,201,.10)}
.char-oggi{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--abisso);background:var(--acqua);
  border-radius:4px;padding:2px 5px;margin-left:8px;vertical-align:middle}

/* ── Riepilogo: chiusura e condivisione ── */
#riep-chiudi{all:unset;position:absolute;z-index:4;
  top:calc(14px + env(safe-area-inset-top,0px));
  right:calc(14px + env(safe-area-inset-right,0px));
  cursor:pointer;width:40px;height:40px;line-height:40px;text-align:center;
  font-size:19px;color:var(--schiuma);border-radius:50%;
  background:rgba(4,18,31,.85);border:1px solid rgba(79,214,201,.35);
  transition:all .2s}
#riep-chiudi:hover{color:var(--corallo);border-color:var(--corallo)}
.riep-azioni{display:flex;justify-content:center;padding:6px 0 26px}
#riep-condividi{all:unset;cursor:pointer;font-family:'Space Mono',monospace;
  font-size:13px;letter-spacing:1px;color:var(--acqua);text-align:center;
  border:1px solid rgba(79,214,201,.45);border-radius:9px;padding:14px 26px;
  background:rgba(79,214,201,.08);transition:all .2s}
#riep-condividi:hover{background:rgba(79,214,201,.2);transform:translateY(-2px)}

@media(max-width:520px){
  /* le opzioni diventano righe alte e i pulsanti larghi, facili da centrare */
  .opt-row{padding:14px 2px}
  .opt-label{font-size:15px}
  .opt-desc{font-size:11px;max-width:none}
  .opt-ctrl{width:100%;gap:7px}
  .opt-ctrl button{flex:1 1 0;min-width:0;text-align:center;
    padding:12px 6px;font-size:12px;min-height:44px;box-sizing:border-box}
  #opt-reset{padding:14px 10px}
  #opt-novita{padding:16px 12px;font-size:12px}
  #riep-chiudi{top:calc(10px + env(safe-area-inset-top,0px));
    right:calc(10px + env(safe-area-inset-right,0px));
    width:44px;height:44px;line-height:44px}
  #riep-condividi{width:100%;box-sizing:border-box;padding:16px 10px}
  .riep-azioni{padding:6px 0 30px}
  .char-item{padding:12px 10px}
}

p_ass1:{ capitolo:"Atto II · Il parco", sfondo:"parco6.jpg", chi:"ass1", tornaHub:"parco",
  imposta:{ ass1:"chiesto" },
  titolo:"«Salga, che la porto io»",
  testo:"Chiedi dov'è l'ingresso del Percorso Blu. Matteo non risponde: valuta la situazione, valuta te, e decide che spiegartelo richiederebbe più tempo di quanto ne abbia. Batte due volte la mano sul portapacchi del carrello di servizio e ti dice di salire. Sali. Vi muovete a otto chilometri orari fra le aiuole, tu aggrappato a una cassetta di ricambi, mentre due bambini ti guardano passare con l'invidia che meriteresti. Ti scarica esattamente davanti al cancelletto, ti indica la scritta INGRESSO PERCORSO BLU, aspetta che tu annuisca, e riparte. Ti volti per ringraziarlo un'ultima volta. Quando ti rigiri, l'ingresso non c'è più.",
},
p_ass2:{ capitolo:"Atto II · Il parco", sfondo:"parco2.jpg", chi:"ass2", tornaHub:"parco",
  imposta:{ ass2:"chiesto" },
  titolo:"«Dopo la centralina, prima del pozzetto»",
  testo:"Chiedi dov'è l'ingresso del Percorso Blu. Massimo posa la cassetta degli attrezzi per terra, perché è chiaramente uno che quando spiega spiega bene. Ti dice di costeggiare il muro fino alla centralina, poi di tenere la destra al pozzetto, poi di passare di fianco la cascatella e trovarti la porta davanti. Ogni riferimento è preciso al metro. Il problema è che nessuna di quelle cose ha un cartello. Fingi di aver capito per sembrare intelligente. Ti direzioni dalla parte opposta in direzione delle casse.",
},
p_ass3:{ capitolo:"Atto II · Il parco", sfondo:"parco3.jpg", chi:"ass3", tornaHub:"parco",
  imposta:{ ass3:"chiesto" },
  titolo:"«Segua i pesciolini, faccio così anch'io»",
  testo:"Chiedi dov'è l'ingresso del Percorso Blu. Sabina ha le mani occupate da un secchio pieno di naselli e di sgombri e non può indicarti niente, ma ha un'idea migliore: da lì è appena uscita lei, e siccome il secchio perde, dietro di sé ha lasciato una scia di pesciolini caduti a intervalli regolari. Basta seguirla al contrario. Ti sembra il sistema di orientamento più solido che ti abbiano proposto stamattina. Ringrazi e parti. I primi otto pesciolini ci sono tutti. Il nono no. Al posto del nono c'è un gabbiano che ti guarda con una serenità inquietante, e da lì in poi la pista è pulitissima, per un tratto molto lungo, in una direzione che non sai più se sia quella giusta. Quando ti fermi, dell'ingresso del Percorso Blu non c'è traccia, e sopra di te si sono radunati altri quattro gabbiani.",
},
p_ass4:{ capitolo:"Atto II · Il parco", sfondo:"parco4.jpg", chi:"ass4", tornaHub:"parco",
  imposta:{ ass4:"chiesto" },
  titolo:"«Ha già pensato a un'esperienza?»",
  testo:"Chiedi dov'è l'ingresso del Percorso Blu. Aurora ti risponde con un'altra domanda: hai già pensato a partecipare ad una attività straordinaria? Ci sono il dietro le quinte e il rettilario come proposte. Dici che no, che vuoi solo entrare, che il biglietto l'hai appena fatto e lo agiti leggermente come prova. Lei annuisce e ti spiega che l'esperienza è comunque separata dal biglietto. Ripeti che vuoi solo entrare. Allora lei indica un punto alle tue spalle e dice che è di là, aggiungendo che comunque il dietro le quinte parte proprio da lì alle undici e mezza. Ti volti convinto, e per il resto della giornata resterai con la sensazione di dover essere da qualche parte alle undici e mezza.",
},
p_ass5:{ capitolo:"Atto II · Il parco", sfondo:"parco5.jpg", chi:"ass5", tornaHub:"parco",
  imposta:{ ass5:"chiesto" },
  titolo:"«Sempre dritto, poi la seconda a sinistra»",
  testo:"Chiedi dov'è l'ingresso del Percorso Blu. Saif te lo spiega indicandoti le porte di ingresso: sempre dritto, poi tieni la destra ed entra dalle porte automatiche. Sono undici parole. Le senti tutte e non ne trattieni nessuna. Lo guardi con la faccia di chi non ha capito. Lui, che è una persona gentile, prova a venirti incontro e te lo ripete in arabo, cosa che oggettivamente non migliora la situazione per nessuno dei due. Alla fine rinuncia alle parole, allunga il braccio e indica il punto esatto. Tu guardi il dito. Poi guardi il dito più da vicino. Ringrazi molto calorosamente e vai dalla parte opposta.",
},

ingresso:{
  capitolo:"Atto III · I tornelli", sfondo:"tornelli.jpg", chi:null,

  testo:"Contro ogni previsione, e senza sapere bene come, ti ritrovi davanti all'ingresso del Percorso Blu. Era esattamente dove tutti e cinque ti avevano indicato. Davanti a te i tornelli, e la fila di persone che stamattina ha capito le indicazioni al primo colpo.",
  avanti:"t_timbro"
},

t_timbro:{
  capitolo:"Atto III · I tornelli", sfondo:"timbro.jpg", chi:"tornelli",
  titolo:"«Buongiorno, biglietto prego»",
  testo:"Cerchi il biglietto nella tasca destra. Non c'è. Nella sinistra. Non c'è. Nel portafoglio, nella custodia del telefono, nella tasca destra di nuovo. Alle tue spalle si forma una fila. Il biglietto era in mano tua dall'inizio. Lui lo timbra senza commentare, perché lo fa una infinità di volte al giorno. «Attenzione a non perderli perchè ti serviranno anche per gli altri padiglioni.» ti dice. Tu annuisci, ma non capisci bene cosa intende.",
  avanti:"tornelli"
},

  capitolo:"Atto III · I tornelli", sfondo:"tornelli.jpg", chi:null, hub:true,
  titolo:"Un attimo prima di entrare",
  testo:"Biglietto timbrato. Sei ufficialmente un visitatore. Prima di infilarti nel Percorso Blu, però, hai ancora quattro domande che ti frullano in testa e un po' di gente attorno a cui poterle fare.",
  interazioni:[
    { testo:"«Scusi, ci sono degli armadietti?»",        vai:"t_armadietti" },

    { testo:"«Scusi, ma come funziona esattamente qui?»", vai:"t_info" },

  ],

},

t_cestino:{
  capitolo:"Atto III · I tornelli", sfondo:"cestino.jpg", chi:"tornelli", tornaHub:"tornelli",
  tornaTesto:"← Torna ai tornelli",
  imposta:{ biglietto:"cestinato" }, rimuovi:"biglietto",

  testo:"Il biglietto è timbrato, quindi per la tua logica ha esaurito la sua funzione nella vita. Lo appallottoli e lo centri nel cestino da tre metri, con una piccola esultanza. L'addetto ai tornelli apre la bocca per dirti qualcosa, poi la richiude e decide che lo scoprirai da solo. Sorride. Non è un bel sorriso.",
},

t_armadietti:{
  capitolo:"Atto III · I tornelli", sfondo:"armadietti.jpg", chi:"armadietti", tornaHub:"tornelli",

},

t_info:{

  testo:"Fai la domanda più larga possibile: mi spieghi come funziona?. Lei ti risponde in modo impeccabile: i percorsi, gli orari dei pasti degli animali, dove sono le mappe, cosa non perdersi. Dura tre minuti. Tu, alla fine, chiedi: «Ma quindi gli squali dove sono?». Lei ricomincia da capo e nel suo sguardo vedi scivolare via ogni speranza nell'umanità.",
},

p_uovo:{

p_flash:{
  capitolo:"Atto IV · I pinguini", sfondo:"pinguini.jpg", chi:"assflash",
  titolo:"«Scusi, il flash è vietato»",
  testo:"Alzi il telefono e fai partire un flash da concerto dritto nella vasca. Nella foto: solo il riflesso della tua faccia sorpresa. Una ragazza dello staff si avvicina e te lo dice con garbo: niente flash, dà fastidio agli animali. Tu fai la faccia di chi ha capito. Annuisci due volte, dici «certo, certo, chiedo scusa» e abbassi il telefono. Lei ti ringrazia e si allontana.",
  avanti:"p_flash2"
},

p_flash2:{
  capitolo:"Atto IV · I pinguini", sfondo:"pinguini.jpg", chi:null,
  titolo:"Undici secondi dopo",
  testo:"Aspetti che si giri. Aspetti ancora un po'. Poi pensi che una sola foto, giusto una, con quel pinguino lì che sta in posa perfetta, non farà male a nessuno. E soprattutto pensi la cosa più sbagliata che si possa pensare in un acquario: che stavolta il flash sia disattivato. Il flash non è disattivato. La vasca si illumina come un rigore all'ottantanovesimo.",
  imposta:{ flash:"colto sul fatto" },
  avanti:"p_flash3"
},

p_flash3:{
  capitolo:"Atto IV · I pinguini", sfondo:"pinguini.jpg", chi:"assflash",
  titolo:"«Allora non ci siamo capiti.»",
  testo:"Non l'hai sentita tornare. È già lì, ferma, alla distanza esatta da cui non si può fingere di non aver visto. Non alza la voce, il che è molto peggio. Tira fuori il telefono, accende la torcia e te la punta negli occhi. «Ecco. FA PIACERE?» E questa volta non ha nessuna intenzione di andarsene.",
  avanti:"fight_flash"
},

fight_flash:{

  titolo:"Uno contro una, e sei in minoranza",
  testo:"Provi a dire che era partito da solo. Non era partito da solo, e lei c'era la prima volta. Provi a dire che non lo rifarai più: è esattamente quello che avevi detto undici secondi prima di rifarlo. Ogni tua risposta viene usata contro di te entro due secondi, e intanto la torcia resta puntata. Non puoi vincere questa discussione: puoi solo arrivare vivo alla fine della predica.",

  }
},

  testo:"Ti allontani dalla vasca con la vista che pulsa, il telefono spento per scelta altrui e la sensazione precisa di essere stato appena educato in pubblico. Gli acquaristi, dall'altra parte del vetro, hanno visto tutto e hanno deciso che non è il caso di conoscerti. Riprendi il percorso da solo.",

p_chiedi:{
  capitolo:"Atto IV · I pinguini", sfondo:"pinguini.jpg", chi:"acq2",
  titolo:"«Cinque minuti per cosa?»",
  testo:"Ti dice che deve solo controllare una cosa dietro la vasca e che tornerà subito. Tu, invece di annuire, gli fai la domanda che nessun essere umano ragionevole farebbe: se puoi entrare dentro con lui. Lui risponde di no. Un no netto, professionale, definitivo.",
  scelte:[
    { testo:"Insisti: «solo un secondo, giuro»", vai:"p_insisti1" },
    { testo:"Lascia perdere",                    vai:"pinguini" }
  ]

  titolo:"«No.»",
  testo:"Gli spieghi che sei sempre stato appassionato di pinguini. Non è vero: fino a undici minuti fa pensavi vivessero solo sul ghiaccio. Lui ti guarda come si guarda un problema che si risolverà da solo, e ripete di no.",
  scelte:[
    { testo:"Insisti ancora: gli offri un caffè", vai:"p_insisti2" },
    { testo:"Lascia perdere",                     vai:"pinguini" }
  ]
},

p_insisti2:{
  capitolo:"Atto IV · I pinguini", sfondo:"pinguini_entrata.jpg", chi:"acq2",
  titolo:"«…va bene. Trenta secondi.»",
  testo:"Gli offri un caffè. Poi due. Poi ti offri di aiutarlo a portare i secchi. Poi gli dici che tanto lo sapete solo voi due. Alla fine cede, non perché tu l'abbia convinto, ma per sfinimento: ti porta nel retro della vasca, apre il cancelletto, ti dice di stare fermo, di non guardarli negli occhi e di non fare movimenti bruschi. Tu entri facendo un movimento brusco e guardandoli negli occhi.",
  imposta:{ vasca:"entrato" },
  avanti:"fight_pinguini"
},

fight_pinguini:{
  capitolo:"Atto IV · I pinguini", sfondo:"pinguini.jpg", chi:null,
  titolo:"Sedici contro uno",
  testo:"I sedici pinguini si voltano tutti insieme, con la sincronia di chi lo fa spesso. Nessuno qui dentro è carino e coccoloso: sono paragonabili a una baby gang milanese con un becco al posto del coltellino e tu sei in piedi in casa loro. Non puoi vincere. Puoi solo raggiungere il cancelletto.",
  dado:{
    n:2, facce:6, min:[9,8,7,3], max:null,
    etichetta:"Raggiungi il cancelletto",
    azione:"🎲 Corri verso l'uscita",
    successo:"Scivoli, ti rialzi, scivoli di nuovo e ti aggrappi al cancelletto. Ce l'hai fatta. Lloro ti lasciano andare perché hanno finito, non perché tu abbia vinto.",
    fallimenti:[
      "Fai due passi e il primo pinguino ti blocca il polpaccio. Gli altri ti hanno circondato e ti imbruttiscono.",
      "Provi a fare quel verso che fai col cane. Non funziona con i pinguini. Peggiora sensibilmente le cose: iniziano a riempirti di mazzate.",
      "Spaventato, inciampi sui tuoi stessi piedi. Un pinguino ti guarda dall'alto, cosa che tecnicamente non dovrebbe poter fare.",
      "Ti rialzi, fai due metri e ti riprendono. A questo punto ti stanno chiaramente prendendo in giro: il cancelletto è lì, basta pochissimo.",
      "Sei praticamente sulla soglia. Uno di loro ti dà un ultimo colpetto sul polpaccio, giusto per firmare il lavoro."
    ],
    vai:"esci_vasca"
  }
},

  capitolo:"Atto IV · I pinguini", sfondo:"pinguini_entrata.jpg", chi:"acq2",
  titolo:"Fuori dalla vasca",
  testo:"Vieni recuperato per la felpa e tirato fuori dal cancelletto. Un pinguino ti sta ancora fissando dal bordo, per ricordarti che non è finita. L'acquarista non dice niente. Non serve. Riprendi il percorso con più umiltà di prima.",

},

  titolo:"La vasca degli squali",
  testo:"Prosegui lungo il percorso e il corridoio si allarga sulla vasca grande. Il buio ti avvolge, il rumore delle persone si abbassa, e davanti ai tuoi occhi passa qualcosa di lungo tre metri. Per un attimo smetti davvero di parlare. Dura poco. Ci sono due acquaristi a bordo vasca e tu hai già due domande pronte.",
  interazioni:[
    { testo:"Chiedi al primo acquarista degli squali toro", vai:"s_acq1" },

      seNon:{ foto_squalo:"fatto" } }

s_acq1:{
  capitolo:"Atto IV · Gli squali", sfondo:"squali_toro.jpg", chi:"acq3", tornaHub:"squali",
  tornaTesto:"← Torna alla vasca",
  titolo:"«Si chiamano così per via del latte»",
  testo:"Chiedi come mai si chiamano squali toro: se è perché sono aggressivi o perché hanno le corna da piccoli. L'acquarista ti guarda per un secondo di troppo, capisce che non ne vale la pena, e ti risponde serissimo che è perché muggiscono e che vengono nutriti esclusivamente con bistecche di manzo, tre volte a settimana. Tu ci credi e lo racconterai stasera a cena come se fosse tuo.",
},

s_acq2:{
  capitolo:"Atto IV · Gli squali", sfondo:"squali_toro.jpg", chi:"acq4", tornaHub:"squali",
  tornaTesto:"← Torna alla vasca",
  titolo:"«Guardi meglio, la didascalia c'è»",
  testo:"Hai notato che uno degli squali è diverso dagli altri: sta fermo sul fondo e ha due baffetti. Cerchi la didascalia e non la trovi. Chiedi spiegazioni. L'acquarista ti dice di guardare meglio, che la didascalia c'è. Tu guardi meglio. Non c'è. Alzi lo sguardo per dirglielo e lui è già a quaranta metri di distanza, che cammina veloce senza voltarsi, come chi ha ricordato all'improvviso una riunione importantissima.",
},

  capitolo:"Atto IV · Gli squali", sfondo:"squali_toro.jpg", chi:null,
  titolo:"Fermo. Adesso. Fermo.",
  testo:"È lì, immobile a mezzo metro dal vetro, con la bocca socchiusa e quell'aria di chi non ha mai avuto un pensiero in vita sua. È la foto della giornata e lo sai. Tiri fuori il telefono. Il vetro riflette, la sala è buia, il flash è vietato e le tue mani non sono ferme da stamattina.",

    etichetta:"Inquadra lo squalo toro",
    azione:"📷 Scatta",
    successo:"Lo prendi. Non benissimo: è mosso, c'è mezzo riflesso della tua faccia sul vetro e la coda esce dall'inquadratura. Ma è uno squalo, si capisce che è uno squalo, e soprattutto è tuo. La guarderai altre quattro volte prima di uscire dal padiglione.",
    fallimenti:[
      "Scatti nell'istante esatto in cui una bambina ti passa davanti. Hai una foto perfetta della nuca di una bambina."
    ],

  }
},

c_manu:{
  capitolo:"Atto IV · Il negozio", sfondo:"negozio.jpg", chi:"manu",
  titolo:"«Guten Tag! Möchten Sie eine Tüte dazu?»",
  testo:"Appoggi sul bancone il tuo {acquisto} e Manu ti sorride e attacca a parlare in tedesco. Fluente, veloce, cordialissimo. Tu non capisci una parola e vai nel panico perchè sembra ti stia minacciando di morte. Per un motivo che non saprai spiegare nemmeno sotto interrogatorio, le tiri addosso l'oggetto. Manu lo prende al volo, lo passa allo scanner, ti fa pagare fino all'ultimo centesimo e poi ti riempie di legnate. Sempre sorridendo. Sempre in tedesco.",
  avanti:"dopo_negozio"
},

c_altra:{
  capitolo:"Atto IV · Il negozio", sfondo:"negozio.jpg", chi:"shop2",
  titolo:"«Glielo incarto? È un regalo?»",
  testo:"Appoggi sul bancone il tuo {acquisto} e lei ti chiede se è un regalo. Tu dici di sì, non si sa perché: è per te. Lei allora tira fuori la carta, il nastro, il fiocco, e ci mette due minuti buoni a confezionarlo come si deve, con cura, mentre la fila dietro cresce. Quando ha finito ti chiede per chi è. Tu, colto alla sprovvista, rispondi: «Per uno». Lei annuisce lentamente. Paghi, prendi il pacchetto che scarterai nel parcheggio come un regalo di Natale, da solo, in piedi.",
  avanti:"dopo_negozio"
},

c_altra_niente:{
  capitolo:"Atto IV · Il negozio", sfondo:"negozio.jpg", chi:"shop2",
  titolo:"«Ma quindi è già finito?»",
  testo:"Non compri niente e ti dirigi con passo deciso verso una porta con la maniglia rossa e la scritta USCITA DI EMERGENZA. Mentre ci appoggi sopra le mani, ti giri verso Manu e le chiedi se è già finito tutto. Con uno sguardo di delusione ti indica le scale per proseguire. Ti giustifichi lamentandoti della segnaletica incomprensibile.",
  avanti:"dopo_negozio"
},

c_manu_niente:{
  capitolo:"Atto IV · Il negozio", sfondo:"negozio.jpg", chi:"manu",
  titolo:"«Il timbro glielo fanno all'uscita»",
  testo:"Non compri niente, ma le tendi il dorso della mano come si fa in discoteca e le chiedi il timbro per rientrare, quello di cui ti hanno parlato all'ingresso. Il timbro esiste davvero, ti spiega, ma lo fanno all'uscita, non in mezzo al percorso, e comunque tu non stai uscendo. Tu resti con la mano tesa ancora qualche secondo di troppo, nel caso cambiasse idea. Non cambia idea. Ritiri la mano fingendo di doverti sistemare i capelli.",
  avanti:"dopo_negozio"
},

  testo:"Esci dal negozio con quello che ti resta: la dignità no, quella è rimasta dentro. Il percorso però non è finito, e il rumore d'acqua ti chiama ancora. Solo che stavolta il rumore d'acqua sembra arrivare dal pavimento.",

incontro_anna:{
  capitolo:"Atto IV · Il corridoio", sfondo:"corridoio.jpg", chi:"anna",
  titolo:"«È lei per il giro alternativo?»",
  testo:"Mentre ti incammini verso l'origine del rumore d'acqua, con passo pesante e lo sguardo perso nel vuoto, una ragazza dello staff ti affianca. Sa che stamattina ti è stato emesso un biglietto con gratuità per disabili. Ti vede zoppicare leggermente (in realtà hai solo le scarpe scomode) e interviene. «Scusi... signore? È lei che ha richiesto il giro alternativo evitando le scale? Se vuole la aiuto io, non si sforzi troppo». Tu la guardi confuso. Non hai nessuna disabilità, sei solo tu.",
  scelte:[
    { testo:"«No guardi, sto benissimo»", vai:"anna_rifiuto" },
    { testo:"Accetta l'aiuto per pietà (+30 Stamina)", vai:"anna_accetta" }
  ]
},

anna_rifiuto:{
  capitolo:"Atto IV · Il corridoio", sfondo:"corridoio.jpg", chi:"anna",
  titolo:"Dignità residua",
  testo:"Provi a raddrizzare la schiena, gonfi il petto in modo innaturale e le assicuri di essere nel pieno delle tue facoltà fisiche e mentali. Anna annuisce molto lentamente. «Va bene, allora forza e coraggio». Ti dà una pacca compassionevole sulla spalla e si allontana. Ti senti improvvisamente invecchiato di vent'anni.",
  avanti:"corridoio"
},

anna_accetta:{
  capitolo:"Atto IV · Il corridoio", sfondo:"corridoio.jpg", chi:"anna",
  stamina:30, imposta:{ carrozzina:"si" },
  titolo:"Trasporto VIP",
  testo:"Sospiri, ti accasci leggermente su te stesso e le dici che sì, in effetti ti faresti aiutare volentieri. Anna fa comparire dal nulla una sedia a rotelle del parco, ti fa accomodare e ti spinge a passo di marcia trionfale per tutto il pezzo di strada che manca. Recuperi un sacco di energie! Solo quando ti scarica, perfettamente in piedi e rinvigorito, davanti agli occhi sgranati di un manutentore in stivali intento a riparare un tubo, ti rendi conto della figura imbarazzante che hai appena fatto.",
  avanti:"corridoio"
},

  testo:"Il corridoio successivo ha due dita d'acqua sul pavimento e i vetri completamente appannati: delle vasche si intuisce solo qualche ombra che passa. Un manutentore in stivali sta armeggiando con una chiave inglese e un tubo che chiaramente non è d'accordo con lui. In fondo a questo corridoio dalla mappa sai essere presente il Relitto dei Giganti, la novità 2026, quella per cui in fondo sei venuto fin qui.",

zarp_pezza:{
  capitolo:"Atto IV · Il corridoio", sfondo:"corridoio2.jpg", chi:"zarp",
  titolo:"«Allora, il problema è a monte»",
  testo:"Fai la domanda più innocua del mondo: cos'è successo. Zarp posa la chiave inglese, si asciuga le mani e comincia. Il problema è a monte, non a valle: c'è una guarnizione della linea di ricircolo che ha ceduto per un colpo d'ariete, e siccome la valvola di non ritorno è tarata male l'acqua è tornata indietro nel by-pass invece di andare al filtro a sabbia. Ti spiega la differenza tra il circuito primario e quello secondario. Ti spiega perché il vetro si appanna, che è una questione di delta termico e di umidità relativa, non di sporco, e che è inutile passarci lo straccio adesso. Ti dice quanto costa la pompa. Ti dice cosa aveva detto lui due anni fa e che nessuno lo aveva ascoltato. Ti chiede se hai capito. Tu dici di sì. Non hai capito niente.",
  avanti:"zarp_fine"
},

bar_francesca:{
  capitolo:"Atto V · Il bar", sfondo:"bancone_bar.jpg", chi:"francesca",
  titolo:"«Mezza di frigo e mezza fuori?»",
  testo:"Le chiedi una bottiglietta d'acqua. Appena la appoggia sul bancone, la sfiori con l'indice e ritrai la mano: «No, così di frigo mi viene una congestione». Francesca, in rigoroso silenzio, la ripone e te ne dà una a temperatura ambiente. La tocchi. «Eh, ma questa è un brodo. Non potrebbe farmi mezza e mezza? O magari passare cinque secondi al microonde quella fredda?». Francesca chiude gli occhi. Conta mentalmente fino a tre. Apre entrambe le bottiglie, ne versa metà e metà in un bicchiere di plastica e te lo spinge davanti con una forza calcolata al millimetro. «Un euro e cinquanta». Paghi e bevi sentendoti un vero intenditore.",
  avanti:"foto_banchetto"
},

  capitolo:"Atto V · Il bar", sfondo:"bancone_bar.jpg", chi:"alessia",
  titolo:"«Cibo. Ecco.»",
  testo:"Fai in tempo a dire la tua ordinazione e il piatto è già davanti a te. Non hai visto la macchina muoversi. Non hai visto lei muoversi. Cerchi di fare conversazione e nel tempo di una frase ha già servito altre due persone, pulito il bancone e risposto al telefono. Mangi in fretta per non sembrare lento anche tu.",
  avanti:"foto_banchetto"
},

bar_aurora:{
  capitolo:"Atto V · Il bar", sfondo:"bancone_bar.jpg", chi:"aurora",
  titolo:"«È incluso nel biglietto, vero?»",
  testo:"Ordini un caffè e, con la massima naturalezza, le chiedi: «Ma questo è incluso nel biglietto dell'Acquario, vero? Ho pagato 25 euro». Aurora non sbatte le palpebre. Ti serve il caffè, ti fissa in un silenzio tombale e si aspetta che tu capisca da solo l'assurdità della cosa. Alla fine te lo offre gratis solo per farti allontanare dal bancone il prima possibile.",
  avanti:"foto_banchetto"
},

  testo:"Guia ti convince a prendere il formato piccolo per sette euro. Tiri fuori i soldi e glieli dai. Lei batte lo scontrino, lo mette nella bustina con la foto e te la porge. Tu guardi il portafoglio vuoto. Guardi lei. E con una sicurezza disarmante esclami: «Scusi, ma mi ha rubato i soldi!». Guia ti inizia a parlare con la voce che si usa con i cuccioli bastonati, ti indica la foto che hai in mano e lo scontrino. «Me li ha appena dati... per pagare la foto». Te ne vai ringraziando a voce bassissima.",

foto_muto:{
  capitolo:"Atto V · Le foto", sfondo:"foto_banchetto.jpg", chi:null,
  titolo:"Nessuno dice niente",
  testo:"Ti volti verso il banchetto. Le guardi. Loro guardano te. Passa un secondo. Ne passa un altro, e questo è già troppo. La tua faccia non comunica nulla: né interesse, né rifiuto, né una qualche forma di vita interiore. Poi, senza dire una sola parola, ti giri e te ne vai. Alle tue spalle cala un silenzio che si sente anche a dieci metri.",
  avanti:"razze_intro"
},

  testo:"Ti avvii verso l'uscita col passo di chi ha concluso una giornata soddisfacente. Non hai fatto tre metri che una voce alle tue spalle dice, con estrema calma «Scusi signore, l'uovo lo deve lasciare qua per gli altri bambini». Ti fermi. Guardi la tua mano. C'è ancora, bianco, tenuto stretto come un piccolo trofeo. Torni indietro fino al cesto e lo rimetti a posto sotto lo sguardo di Michele, che non aggiunge niente e non ha bisogno di aggiungere niente. Riprendi la strada dell'uscita, senza aver chiesto niente e senza nessun timbro sulla mano.",

  titolo:"Sospetto",
  testo:"La tua risposta esce con un tono talmente incerto e dubbioso che Tito fa un passo indietro. Ti squadra da capo a piedi. «Lei... crede? Non ne è sicuro?». Provi a spiegare che ti sentivi solo empatico, ma lui sta già portando il telefono alla bocca: «Ho un individuo sospetto al parco. Fate arrivare i Carabinieri». Si allontana rapidamente tenendoti d'occhio. Forse è meglio cambiare zona.",

},

bambino_arresto:{
  capitolo:"Finale · Fermo di polizia", sfondo:"parco_bambino.jpg", chi:null, finale:"bad",
  immagineFine:"game_over_arresto.jpg",
  esitoLabel:"Finale Negativo · Il papà sbagliato",
  titolo:"«Non è il mio papà»",
  testo:"Non fai in tempo a cambiare zona. Tito torna dopo neanche due minuti tenendo per mano un bambino di sette anni con un cono gelato e un'espressione di totale disinteresse. «È lui tuo padre?». Il bambino ti guarda per tre secondi buoni, lecca il gelato e dice: «Non è il mio papà». Il silenzio che segue dura molto più di quanto sia comodo per chiunque. Poi il piazzale si riempie di divise: due Carabinieri ti prendono garbatamente sottobraccio mentre tu spieghi a voce sempre più alta che volevi solo essere gentile. L'ultima cosa che vedi dell'Acquario di Cattolica è il parcheggio, dal finestrino posteriore di una gazzella."
},

  testo:"Ti metti in fila al primo ingresso che trovi. Davanti a te una signora infila il biglietto nel lettore e passa senza pensarci. Tocca a te. Tasca destra. Tasca sinistra. Portafoglio. Tasca destra di nuovo, con più convinzione. Poi ti torna in mente, con una nitidezza feroce, il gesto perfetto con cui stamattina hai appallottolato il biglietto e l'hai centrato nel cestino da tre metri, con tanto di esultanza. Dietro di te la fila si allunga. Ti fai da parte.",

},

  testo:"Ti metti in fila, arrivi davanti al lettore e cerchi il biglietto. Tasca destra, tasca sinistra, portafoglio. Poi il ricordo: il biglietto appallottolato, il cestino, l'esultanza. Spieghi la situazione e ti viene risposto, con una gentilezza che non ammette repliche, che senza biglietto in un padiglione non si entra e basta. Resti lì in mezzo al vialetto, con una giornata intera davanti e niente da fare. Poi ti guardi il dorso della mano. C'è ancora quel segno azzurro.",

  titolo:"Danni collaterali",
  testo:"Arrivi alla vasca dei pinguini. C'è un manutentore che sta sudando e pulendo disperatamente il cancelletto del retrovasca. «Guardi, un disastro», sbotta appena ti vede. «Stamattina un genio è entrato nella vasca, ha fatto agitare tutti i pinguini e ora mi tocca disinfettare tutto. Se lo becco, gli faccio passare la voglia di camminare. Dio solo sa cosa non gli farei!». Tu deglutisci, fischietti e fai finta di ammirare un pinguino che nuota sul fondo. Annuisci debolmente e prosegui.",
  avanti:"r_squali_bivio"
},

r_pinguini_innocente:{
  capitolo:"Atto VI · Il rientro", sfondo:"pinguini.jpg", chi:"manutentore_pinguini",
  titolo:"La coda di paglia",
  testo:"Arrivi alla vasca dei pinguini. Un manutentore sta pulendo furiosamente il cancelletto del retrovasca. «Un disastro», sbotta appena ti vede. «Stamattina un genio è entrato nella vasca, ha agitato gli animali e ora devo disinfettare tutto!». Tu non c'entri nulla, sei innocente. Eppure, il tuo cervello sceglie la peggior frase possibile per fare conversazione: «Eh immagino, mordono forte sui polpacci, vero? Soprattutto quello con la macchia. Me l'ha... detto un amico». Il manutentore si blocca e ti fissa con gli occhi socchiusi. Sorridi nervosamente e ti allontani a passo svelto prima che chiami la sicurezza.",
  avanti:"r_squali_bivio"
},
